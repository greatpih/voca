<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>시나모롤 스펠링 게임</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --card: #ffffff;
        --primary: #f07eb8;
        --primary-dark: #c84d8c;
        --text: #2d3250;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
      .container { max-width: 920px; margin: 0 auto; padding: 18px; }
      .header {
        background: linear-gradient(90deg, #f8dff1, #dff2ff);
        border-radius: 16px; padding: 16px;
        display: flex; justify-content: space-between; align-items: center; gap: 12px;
      }
      .title { margin: 0; font-size: 32px; }
      .subtitle { margin: 6px 0 0; color: #4b5270; }
      .hero {
        width: 110px; height: 110px; border-radius: 14px; background: #fff;
        border: 2px solid #e7ecff; object-fit: contain; padding: 8px;
      }

      .grid { display: grid; grid-template-columns: 2fr 1fr; gap: 14px; margin-top: 14px; }
      .card { background: var(--card); border-radius: 14px; padding: 16px; box-shadow: 0 6px 18px rgba(27,39,94,.08); }
      .stats { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }
      .chip { background: #eef2ff; border-radius: 999px; padding: 7px 12px; font-weight: 700; }
      .hintLabel { font-size: 13px; color: #4f648a; letter-spacing: 1px; font-weight: 700; }
      .hint { background: #eff8ff; border-radius: 12px; padding: 18px; margin: 8px 0 12px; font-size: 30px; font-weight: 800; text-align: center; }
      .input { width: 100%; border: 2px solid #d8e1f4; border-radius: 12px; font-size: 28px; padding: 10px 12px; }

      .btn {
        width: 100%; border: none; border-radius: 12px; background: var(--primary);
        color: white; font-size: 22px; font-weight: 700; padding: 12px; margin-top: 12px; cursor: pointer;
      }
      .btn:hover { background: var(--primary-dark); }
      .btn.secondary { background: #b1c5ff; }

      .feedback { min-height: 30px; margin-top: 8px; font-weight: 700; }
      .ok { color: #0f8b4c; }
      .bad { color: #c03245; }

      .stickers { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-top: 10px; }
      .sticker {
        border: 1px solid #dce6ff; border-radius: 10px; min-height: 112px;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        gap: 6px; background: #fafcff; padding: 8px;
      }
      .sticker img { width: 72px; height: 72px; object-fit: contain; }
      .lock { color: #9ca9c6; font-size: 28px; }
      .small { font-size: 12px; color: #5f6f8f; }
      .notice { margin-top: 10px; font-size: 12px; color: #5e6c86; line-height: 1.4; }

      @media (max-width: 760px) {
        .grid { grid-template-columns: 1fr; }
        .hint { font-size: 24px; }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <div>
          <p style="margin:0;font-weight:700;color:#8a4f8d;">CINNAMOROLL WORD GAME</p>
          <h1 class="title">시나모롤 스펠링 게임 ✨</h1>
          <p class="subtitle">영어 뜻을 보고 단어 스펠링을 적어요! (7세 맞춤)</p>
        </div>
        <img id="heroImage" class="hero" src="./public/stickers/sticker_01.png" alt="시나모롤" />
      </div>

      <div class="grid">
        <div class="card">
          <div class="stats">
            <span id="progress" class="chip">문제 1 / 10</span>
            <span id="stars" class="chip">⭐ 0</span>
            <span id="draws" class="chip">뽑기 0회</span>
          </div>

          <div class="hintLabel">ENGLISH MEANING</div>
          <div id="hint" class="hint"></div>

          <label for="answer" style="font-weight:700;">뜻을 보고 영어 스펠링 써 보세요</label>
          <input id="answer" class="input" placeholder="여기에 입력" autocomplete="off" />
          <button id="checkBtn" type="button" class="btn">정답 확인</button>
          <button id="nextBtn" type="button" class="btn secondary">다음 문제</button>
          <div id="feedback" class="feedback"></div>
        </div>

        <div class="card">
          <h2 style="margin-top:0;">🎁 스티커 뽑기</h2>
          <p style="margin:6px 0;">별 1개 모으면 뽑기 1번!</p>
          <button id="drawBtn" type="button" class="btn">뽑기 하기</button>
          <div id="drawFeedback" class="feedback"></div>

          <h3 style="margin:12px 0 8px;">내 스티커북</h3>
          <div id="stickerGrid" class="stickers"></div>

          <div class="notice">
            이미지 파일은 <code>public/stickers/sticker_01.png</code> ~ <code>sticker_07.png</code>로 넣어주세요.<br />
            (jpg/jpeg/webp도 자동 인식)
          </div>
        </div>
      </div>
    </div>

    <script>
      const words = [
        { word: 'dust lane', hint: 'dark lines of dust in a galaxy' },
        { word: 'core', hint: 'the central part of something' },
        { word: 'galaxy', hint: 'a huge system of stars, gas, and dust held together by gravity' },
        { word: 'halo', hint: 'a faint outer region around a galaxy' },
        { word: 'pair', hint: 'two things that go together' },
        { word: 'isolated', hint: 'separate and alone' },
        { word: 'dim', hint: 'not bright' },
        { word: 'edge', hint: 'the outer border of something' },
        { word: 'luminous', hint: 'giving off light; shining' },
        { word: 'speck', hint: 'a very small spot' }
      ];

      const stickerIds = [1, 2, 3, 4, 5, 6, 7].map(n => `sticker_${String(n).padStart(2, '0')}`);
      const extCandidates = ['png', 'jpg', 'jpeg', 'webp'];

      const ui = {
        progress: document.getElementById('progress'),
        stars: document.getElementById('stars'),
        draws: document.getElementById('draws'),
        hint: document.getElementById('hint'),
        answer: document.getElementById('answer'),
        feedback: document.getElementById('feedback'),
        drawFeedback: document.getElementById('drawFeedback'),
        stickerGrid: document.getElementById('stickerGrid'),
        heroImage: document.getElementById('heroImage')
      };

      const state = { current: 0, stars: 0, solved: {}, collected: [] };

      async function firstExistingImage(id) {
        for (const ext of extCandidates) {
          const url = `./public/stickers/${id}.${ext}`;
          try {
            const res = await fetch(url, { method: 'HEAD' });
            if (res.ok) return url;
          } catch {}
        }
        return null;
      }

      function saveState() {
        localStorage.setItem('voca-kids-state', JSON.stringify(state));
      }

      function loadState() {
        const raw = localStorage.getItem('voca-kids-state');
        if (!raw) return;
        try {
          const parsed = JSON.parse(raw);
          state.current = parsed.current || 0;
          state.stars = parsed.stars || 0;
          state.solved = parsed.solved || {};
          state.collected = parsed.collected || [];
        } catch {}
      }

      function setFeedback(target, msg, ok) {
        target.textContent = msg;
        target.className = `feedback ${ok ? 'ok' : 'bad'}`;
      }

      function renderHeader() {
        ui.progress.textContent = `문제 ${state.current + 1} / ${words.length}`;
        ui.stars.textContent = `⭐ ${state.stars}`;
        ui.draws.textContent = `뽑기 ${state.stars}회`;
      }

      function renderQuestion() {
        if (state.current >= words.length) state.current = 0;
        ui.hint.textContent = words[state.current].hint;
        ui.answer.value = '';
        setFeedback(ui.feedback, '', true);
        renderHeader();
      }

      function normalize(value) {
        return value.trim().toLowerCase().replace(/\s+/g, ' ');
      }

      function checkAnswer() {
        const user = normalize(ui.answer.value);
        const q = words[state.current];
        const answer = normalize(q.word);

        if (!user) {
          setFeedback(ui.feedback, '먼저 단어를 입력해 주세요.', false);
          return;
        }

        if (user === answer) {
          setFeedback(ui.feedback, `정답! "${q.word}" ⭐ 1개 획득`, true);
          if (!state.solved[state.current]) {
            state.solved[state.current] = true;
            state.stars += 1;
          }
          renderHeader();
          saveState();
          return;
        }

        setFeedback(ui.feedback, `아쉬워요! 정답은 "${q.word}"`, false);
      }

      function nextQuestion() {
        state.current = (state.current + 1) % words.length;
        saveState();
        renderQuestion();
      }

      function drawSticker() {
        if (state.stars < 1) {
          setFeedback(ui.drawFeedback, '별이 부족해요. 정답을 맞혀서 별을 모아보세요!', false);
          return;
        }

        const remaining = stickerIds.filter(id => !state.collected.includes(id));
        if (!remaining.length) {
          setFeedback(ui.drawFeedback, '모든 스티커를 모았어요! 🎉', true);
          return;
        }

        state.stars -= 1;
        const picked = remaining[Math.floor(Math.random() * remaining.length)];
        state.collected.push(picked);

        setFeedback(ui.drawFeedback, `${picked} 획득! (중복 없이 저장됨)`, true);
        saveState();
        renderHeader();
        renderStickerGrid();
      }

      async function renderStickerGrid() {
        ui.stickerGrid.innerHTML = '';
        for (const id of stickerIds) {
          const cell = document.createElement('div');
          cell.className = 'sticker';

          if (state.collected.includes(id)) {
            const imgPath = await firstExistingImage(id);
            if (imgPath) {
              cell.innerHTML = `<img src="${imgPath}" alt="${id}" /><div class="small">${id}</div>`;
            } else {
              cell.innerHTML = `<div class="lock">🖼️</div><div class="small">${id} (파일 없음)</div>`;
            }
          } else {
            cell.innerHTML = `<div class="lock">🔒</div><div class="small">잠김</div>`;
          }

          ui.stickerGrid.appendChild(cell);
        }
      }

      async function setupHeroImage() {
        const img = await firstExistingImage('sticker_01');
        if (img) ui.heroImage.src = img;
      }

      document.getElementById('checkBtn').addEventListener('click', checkAnswer);
      document.getElementById('nextBtn').addEventListener('click', nextQuestion);
      document.getElementById('drawBtn').addEventListener('click', drawSticker);
      ui.answer.addEventListener('keydown', e => {
        if (e.key === 'Enter') checkAnswer();
      });

      loadState();
      renderQuestion();
      renderHeader();
      renderStickerGrid();
      setupHeroImage();
    </script>
  </body>
</html>
