<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="쿠키 셈놀이">
<title>토리의 쿠키 셈놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 1280x720 고정 캔버스를 화면에 맞춰 확대/축소하는 앱형 레이아웃. 자리값 색: 십=파랑, 일=주황 */
:root{
  --navy:#1b2766; --navy-deep:#0f1846;
  --sun:#ffc93c; --sun-d:#df9500;
  --green-d:#1f8a14;
  --tori:#f04347; --bora:#9a4ef0;
  --tens:#2d7ff9; --ones:#ff8a00;
  --ink:#3b2a4a;
  --table:#ffc4da;
  --font:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#150d36}
body{font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:var(--font);color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
#app{position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%,#fff 60%,transparent 70%),
    radial-gradient(1.2px 1.2px at 28% 72%,#cfc6ff 60%,transparent 70%),
    radial-gradient(1.8px 1.8px at 46% 30%,#fff 60%,transparent 70%),
    radial-gradient(1.2px 1.2px at 64% 84%,#fff 60%,transparent 70%),
    radial-gradient(1.6px 1.6px at 82% 22%,#e2dcff 60%,transparent 70%),
    radial-gradient(1.2px 1.2px at 92% 64%,#fff 60%,transparent 70%),
    radial-gradient(ellipse at 50% 120%,#3a1d7a,#150d36 70%);}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;background:#fff3b5;box-shadow:0 0 60px rgba(0,0,0,.5)}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}

/* ---------- 상단바 ---------- */
.topbar{position:absolute;left:0;right:0;top:0;height:60px;background:linear-gradient(#2a3c8e,#1b2766);display:flex;align-items:center;gap:12px;padding:0 14px;z-index:20;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.ibtn{width:44px;height:44px;flex:none;border-radius:13px;border:none;background:linear-gradient(#ffd75e,#ffc12e);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 4px 0 var(--sun-d);display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-d)}
.ibtn svg{width:26px;height:26px}
.tb-title{font-size:25px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
.pill{height:40px;border-radius:20px;background:var(--navy-deep);display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px;padding:0 16px 0 10px;position:relative;overflow:hidden;font-variant-numeric:tabular-nums;flex:none}
.pill svg{width:26px;height:26px;flex:none;position:relative}
.pill span{position:relative}
.pill .fill{position:absolute;left:3px;top:3px;bottom:3px;border-radius:17px;background:linear-gradient(#ffbe45,#ff8d1c);width:0;transition:width .5s ease}

/* ---------- 놀이 화면: 방 ---------- */
.scene{position:absolute;left:0;right:0;top:60px;height:500px;overflow:hidden}
.wall{position:absolute;left:0;right:0;top:0;height:194px;background:
  radial-gradient(circle at 32px 32px,rgba(255,255,255,.7) 4px,transparent 5px) 0 0/64px 64px,
  repeating-linear-gradient(90deg,rgba(255,214,120,.28) 0 30px,transparent 30px 64px),
  linear-gradient(#fff9d8,#ffe89a)}
.wall::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 20%,rgba(255,255,255,.55),transparent 60%)}
.bunting{position:absolute;left:0;top:-4px;width:1280px;height:46px;z-index:1;animation:sway 4s ease-in-out infinite;transform-origin:50% 0}
@keyframes sway{0%,100%{transform:rotate(-.3deg)}50%{transform:rotate(.3deg)}}
.window{position:absolute;left:532px;top:10px;width:216px;height:116px;border-radius:14px;
  background:
    radial-gradient(circle at 168px 30px,#fff6b0 0 16px,rgba(255,240,150,.5) 17px,transparent 30px),
    radial-gradient(ellipse 70px 16px at 60px 34px,#fff 60%,transparent 62%),
    radial-gradient(ellipse 40px 12px at 92px 26px,#fff 60%,transparent 62%),
    radial-gradient(ellipse 160px 50px at 40px 120px,#7fcf5b 60%,transparent 61%),
    radial-gradient(ellipse 180px 46px at 190px 126px,#98dc6c 60%,transparent 61%),
    linear-gradient(#73c8ff,#cdf1ff);
  box-shadow:0 0 0 9px #c8916c,0 0 0 12px #a8714f,inset 0 6px 12px rgba(0,0,0,.08),0 10px 18px 10px rgba(120,70,20,.12)}
.window::before,.window::after{content:'';position:absolute;background:linear-gradient(90deg,#b98060,#d7a17c,#b98060)}
.window::before{left:50%;top:0;bottom:0;width:8px;margin-left:-4px}
.window::after{top:50%;left:0;right:0;height:8px;margin-top:-4px;background:linear-gradient(#d7a17c,#b98060)}
.sill{position:absolute;left:512px;top:128px;width:256px;height:12px;border-radius:5px;background:linear-gradient(#e0ab84,#b98060);box-shadow:0 5px 8px rgba(120,70,20,.2)}
.curtain{position:absolute;top:0;width:52px;height:156px;border-radius:0 0 26px 26px;background:repeating-linear-gradient(90deg,#a3dc6a 0 9px,#c6f08f 9px 17px,#b4e57c 17px 26px);box-shadow:inset 0 -10px 12px rgba(60,120,20,.15)}
.curtain.l{left:488px;transform:skewX(4deg)}.curtain.r{left:740px;transform:skewX(-4deg)}
.table{position:absolute;left:0;right:0;top:192px;bottom:0;z-index:2;background-color:var(--table);
  background-image:linear-gradient(rgba(150,40,90,.16),transparent 46px),linear-gradient(90deg,rgba(255,255,255,.4) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.4) 50%,transparent 50%);
  background-size:100% 100%,54px 54px,54px 54px;border-top:7px solid #ffe3ee;box-shadow:0 -3px 0 #f6a9c8}

/* ---------- 캐릭터 ---------- */
.chr-wrap{position:absolute;top:0;width:220px;height:210px;z-index:1;--lx:0;--ly:0}
.chr-wrap.tori{left:200px}.chr-wrap.bora{left:860px}
.chr{width:100%;height:100%;display:block;overflow:visible}
.chr .bob{transform-origin:110px 210px;animation:breathe 2.6s ease-in-out infinite}
.chr-wrap.hop .bob{animation:hop .55s ease}
.chr-wrap.shake .bob{animation:headshake .5s ease}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.018,.985)}}
@keyframes hop{0%{transform:translateY(0)}20%{transform:translateY(4px) scale(1.06,.92)}50%{transform:translateY(-26px) scale(.96,1.05)}80%{transform:translateY(2px) scale(1.04,.95)}100%{transform:none}}
@keyframes headshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
.chr .look{transform:translate(calc(var(--lx)*1px),calc(var(--ly)*1px));transition:transform .35s ease}
.chr .blink{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.chr-wrap.bora .blink{animation-delay:1.7s;animation-duration:5.3s}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.08)}}
.chr .ears{transform-box:fill-box;transform-origin:50% 100%}
.chr-wrap.bora .earL{transform-box:fill-box;transform-origin:50% 95%;animation:earL 3.2s ease-in-out infinite}
.chr-wrap.bora .earR{transform-box:fill-box;transform-origin:50% 95%;animation:earR 3.2s ease-in-out infinite .4s}
@keyframes earL{0%,100%{transform:rotate(0)}50%{transform:rotate(-6deg)}}
@keyframes earR{0%,100%{transform:rotate(0)}50%{transform:rotate(6deg)}}
.chr .e-happy,.chr .e-sad,.chr .e-wow,.chr .m-happy,.chr .m-sad,.chr .m-wow,.chr .m-eat{display:none}
.chr[data-mood=happy] .e-normal,.chr[data-mood=happy] .m-normal,.chr[data-mood=happy] .brow,
.chr[data-mood=sad] .e-normal,.chr[data-mood=sad] .m-normal,.chr[data-mood=sad] .brow,
.chr[data-mood=wow] .e-normal,.chr[data-mood=wow] .m-normal,
.chr[data-mood=eat] .e-normal,.chr[data-mood=eat] .m-normal,.chr[data-mood=eat] .brow{display:none}
.chr[data-mood=happy] .e-happy,.chr[data-mood=happy] .m-happy,.chr[data-mood=sad] .e-sad,.chr[data-mood=sad] .m-sad,
.chr[data-mood=wow] .e-wow,.chr[data-mood=wow] .m-wow,.chr[data-mood=eat] .e-happy,.chr[data-mood=eat] .m-eat{display:inline}
.chr .m-eat{transform-box:fill-box;transform-origin:50% 0;animation:chew .22s ease-in-out infinite alternate}
@keyframes chew{from{transform:scaleY(1)}to{transform:scaleY(.35)}}
.paws{position:absolute;top:178px;width:160px;height:40px;z-index:4;pointer-events:none}
.paws.tori{left:230px}.paws.bora{left:890px}
.paws .p{transform-box:fill-box;transform-origin:50% 100%;transition:transform .2s}
.paws.clap .p1{animation:pawtap .3s ease-in-out infinite alternate}
.paws.clap .p2{animation:pawtap .3s ease-in-out infinite alternate .15s}
@keyframes pawtap{from{transform:translateY(0)}to{transform:translateY(-12px) rotate(-6deg)}}

/* ---------- 말풍선 / 칠판 ---------- */
.bub{position:absolute;top:14px;width:136px;height:136px;border-radius:50%;background:radial-gradient(circle at 38% 30%,#fff 55%,#f1ecfb);display:grid;place-items:center;font-size:84px;line-height:1;z-index:4;box-shadow:0 7px 0 rgba(120,60,90,.14),0 12px 22px rgba(120,60,90,.14)}
.bub::after{content:'';position:absolute;bottom:-14px;left:50%;margin-left:-14px;border:14px solid transparent;border-top-color:#f9f7fd;border-bottom:0}
.bub.l{left:58px;color:var(--tori)}.bub.r{left:1086px;color:var(--bora)}
.bub .num{display:block;font-variant-numeric:tabular-nums}
.blabel{position:absolute;top:158px;width:150px;text-align:center;font-size:19px;z-index:4;color:#fff;background:rgba(80,40,110,.82);border-radius:14px;padding:3px 0}
.blabel.l{left:51px}.blabel.r{left:1079px}
.blabel:empty{display:none}
.qbox{display:grid;place-items:center;width:72px;height:86px;border:5px solid #e3263a;color:#e3263a;font-size:70px;border-radius:6px}
.qbox.typed{border-color:var(--bora);color:var(--bora);font-size:60px;width:96px}
.qbox .ghost{opacity:.3}
.bub.pop{animation:bubpop .4s cubic-bezier(.2,1.6,.4,1)}
@keyframes bubpop{0%{transform:scale(.8)}50%{transform:scale(1.14)}100%{transform:scale(1)}}
.eq{position:absolute;left:460px;top:126px;width:360px;height:70px;z-index:4;background:linear-gradient(#428a67,#2f6b4f);border:7px solid #c8916c;border-radius:14px;color:#fff;font-size:42px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:inset 0 2px 0 rgba(255,255,255,.15),0 0 0 2px #a8714f,0 8px 12px rgba(80,30,40,.28);white-space:nowrap}
.eq .t{color:#a6d0ff}.eq .o{color:#ffd28a}.eq .op{color:#fff;opacity:.9}
.eq .q{display:inline-grid;place-items:center;min-width:52px;height:50px;border:3px dashed rgba(255,255,255,.7);border-radius:8px;font-size:38px}
.eq .lbl{font-size:30px;opacity:.9}
.eq .solved{color:#c8ff9e;display:inline-block;animation:bubpop .45s cubic-bezier(.2,1.6,.4,1)}

/* ---------- 접시 / 쿠키 ---------- */
.plate{position:absolute;top:204px;width:600px;height:280px;border-radius:150px/120px;background:radial-gradient(ellipse at 50% 25%,#fff,#eef2f6);z-index:3;box-shadow:0 11px 0 #ecc3d6,0 20px 28px rgba(160,40,90,.25),inset 0 -5px 0 rgba(0,0,0,.04)}
.plate::before{content:'';position:absolute;inset:16px;border-radius:134px/104px;background:radial-gradient(ellipse at 50% 30%,#fbffff,#d3edf6);box-shadow:inset 0 6px 10px rgba(80,130,160,.18)}
.plate::after{content:'';position:absolute;left:70px;top:8px;width:150px;height:22px;border-radius:50%;border-top:5px solid rgba(255,255,255,.95);transform:rotate(-6deg)}
.plate.L{left:20px}.plate.R{left:660px}
.scene.mode-count .plate.L{left:340px}
.scene.mode-count .plate.R{display:none}
.inner{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:20px;padding-bottom:42px}
.rods{display:flex;gap:3px;align-items:flex-end;min-height:190px}
.singles{position:relative;width:236px;height:164px;flex:none}
.tfbg{position:absolute;left:-6px;width:248px;height:84px;padding:6px;display:grid;grid-template-columns:repeat(5,44px);grid-template-rows:34px 34px;gap:4px;border-radius:16px;background:linear-gradient(#fffaf2,#f6ead8);box-shadow:0 4px 0 #e6cfae,0 6px 10px rgba(140,90,30,.15)}
.tfbg i{border-radius:50%;margin:3px 2px;background:radial-gradient(ellipse at 50% 40%,#e6cfb0 40%,#f3e4cf 75%);box-shadow:inset 0 2px 3px rgba(120,80,30,.18)}
.tfbg.f0{bottom:-6px}.tfbg.f1{top:-6px;display:none}
.singles.two .tfbg.f1{display:grid;animation:pin .35s cubic-bezier(.2,1.4,.4,1)}
.sgrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,44px);grid-template-rows:34px 34px 12px 34px 34px;gap:4px}
.item{position:relative;cursor:pointer;will-change:transform;transform-origin:50% 75%}
.ck{width:44px;height:34px}
.ck>svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 1px rgba(120,60,20,.28))}
.rod{width:30px;height:190px}
.rod>svg{width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(2px 4px 1px rgba(120,60,20,.25))}
.rod .band{transform-box:fill-box;transform-origin:center}
.rod.wrap .band{animation:bandwrap .5s cubic-bezier(.2,1.5,.4,1) both}
@keyframes bandwrap{from{transform:scaleX(0) scaleY(.4)}to{transform:none}}
.rod.snap .band{animation:bandsnap .4s ease-in forwards}
@keyframes bandsnap{to{transform:translate(18px,-40px) rotate(40deg);opacity:0}}
.item.counted>svg{filter:drop-shadow(0 0 4px #ffd000) drop-shadow(0 0 3px #ffb300) drop-shadow(0 3px 1px rgba(120,60,20,.25))}
.item.glow>svg{filter:drop-shadow(0 0 7px #fff36b) drop-shadow(0 0 3px #ffcf00)}
.badge{position:absolute;left:50%;transform:translateX(-50%);background:linear-gradient(#ffe066,#ffc12e);color:var(--ink);border-radius:10px;font-size:18px;padding:1px 7px;white-space:nowrap;box-shadow:0 2px 0 var(--sun-d);pointer-events:none;animation:badgein .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes badgein{from{transform:translateX(-50%) scale(0)}}
.rod .badge{top:-30px;font-size:19px}
.ck .badge{top:-16px;font-size:14px;padding:0 5px}

.hand{position:absolute;left:0;top:0;width:66px;height:66px;z-index:30;pointer-events:none;display:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.hand.on{display:block;animation:handtap 1s ease-in-out infinite}
@keyframes handtap{0%,100%{translate:0 0}50%{translate:6px 14px}}

/* ---------- 효과 ---------- */
.fx{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.okring{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;border:46px solid #4fd534;box-shadow:inset 0 0 0 5px rgba(255,255,255,.55),0 0 0 8px #fff,0 12px 22px rgba(0,0,0,.25);background:radial-gradient(circle,rgba(255,255,255,.35),transparent 60%);animation:okpop 1.1s ease forwards}
@keyframes okpop{0%{transform:scale(.2) rotate(-40deg);opacity:0}25%{transform:scale(1.12) rotate(0);opacity:1}40%{transform:scale(1)}80%{transform:scale(1);opacity:1}100%{transform:scale(1.25);opacity:0}}
.xmark{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;animation:xpop .9s ease forwards}
@keyframes xpop{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.1);opacity:1}35%{transform:scale(1) translateX(-10px)}45%{transform:translateX(10px)}55%{transform:translateX(-6px)}65%{transform:none;opacity:1}100%{opacity:0}}
.xmark::before,.xmark::after{content:'';position:absolute;left:50%;top:50%;width:170px;height:38px;margin:-19px 0 0 -85px;border-radius:19px;background:#ff4a5a;box-shadow:0 0 0 6px #fff}
.xmark::before{transform:rotate(45deg)}.xmark::after{transform:rotate(-45deg)}
.spark{position:absolute;font-size:28px;line-height:1;animation:spark .9s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(200deg);opacity:0}}
.conf{position:absolute;width:12px;height:18px;border-radius:3px;animation:conf 1.4s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}60%{opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 260px)) rotate(var(--r));opacity:0}}
.puff{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;opacity:.9;animation:puff .45s ease-out forwards}
@keyframes puff{to{transform:translate(var(--dx),var(--dy)) scale(1.8);opacity:0}}
.crumb{position:absolute;width:7px;height:6px;border-radius:40%;background:#c98236;animation:crumb .7s ease-in forwards}
@keyframes crumb{to{transform:translate(var(--dx),60px) rotate(140deg);opacity:0}}
.floattxt{position:absolute;font-size:34px;color:#fff;text-shadow:-3px -3px 0 #3b2a4a,3px -3px 0 #3b2a4a,-3px 3px 0 #3b2a4a,3px 3px 0 #3b2a4a,0 4px 0 #3b2a4a,0 -4px 0 #3b2a4a,4px 0 0 #3b2a4a,-4px 0 0 #3b2a4a;animation:floatup 1.1s ease-out forwards;white-space:nowrap}
.floattxt.sm{font-size:22px;color:#ffe066;animation-duration:.8s}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.5);opacity:0}20%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}
.banner{position:absolute;left:50%;top:150px;transform:translateX(-50%);background:linear-gradient(#ffe066,#ffbe1f);color:var(--ink);font-size:40px;padding:10px 34px;border-radius:40px;box-shadow:0 6px 0 var(--sun-d),0 12px 20px rgba(120,60,0,.25);white-space:nowrap;animation:banner 1.5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes banner{0%{transform:translateX(-50%) scale(0)}15%{transform:translateX(-50%) scale(1.1)}25%,80%{transform:translateX(-50%) scale(1);opacity:1}100%{transform:translateX(-50%) translateY(-20px);opacity:0}}

/* ---------- 풀이 설명 ---------- */
.explain{position:absolute;inset:0;z-index:35;display:none;background:rgba(45,20,70,.5)}
.explain.on{display:block;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.xb{position:absolute;top:14px;width:136px;height:136px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:84px;box-shadow:0 0 0 6px rgba(255,255,255,.35)}
.xb.l{left:58px;color:var(--tori)}.xb.r{left:1086px;color:var(--bora)}
.arr{position:absolute;left:210px;top:70px;width:862px;height:26px}
.arr .track{position:absolute;left:0;right:34px;top:3px;height:20px;background:#fff;border-radius:4px}
.arr .afill{position:absolute;left:0;top:3px;height:20px;width:0;background:#5be22f;border-radius:4px}
.arr.go .afill{animation:afill 1s ease forwards .2s}
@keyframes afill{to{width:calc(100% - 34px)}}
.arr .head{position:absolute;right:0;top:-12px;border:25px solid transparent;border-left:36px solid #fff;border-right:0;transition:border-left-color .2s 1.2s}
.arr.go .head{border-left-color:#5be22f}
.arrlabel{position:absolute;left:210px;width:828px;top:20px;text-align:center;color:#fff;font-size:32px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.vcard{position:absolute;left:190px;top:190px;width:900px;height:296px;background:#fff;border-radius:30px;box-shadow:0 10px 0 rgba(90,40,120,.25);display:flex;align-items:center;gap:34px;padding:18px 40px;animation:cardin .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardin{from{transform:translateY(40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.vg{display:grid;grid-template-columns:56px 84px 84px;grid-template-rows:28px 30px 64px 64px 8px 66px;font-size:58px;text-align:center;align-items:center;flex:none;font-variant-numeric:tabular-nums}
.vg .hd{font-size:21px;border-radius:9px;margin:0 14px;line-height:28px}
.vg .t{color:var(--tens)}.vg .o{color:var(--ones)}

const KEY='tori-cookie-math-v1';
const DEF={stars:{},gems:0,day:'',today:0,settings:{sfx:true,count:6,input:'choice'},total:{solved:0,correct:0}};
function load(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  const base=JSON.parse(JSON.stringify(DEF));
  if(!d||typeof d!=='object')return base;
  return Object.assign(base,d,{settings:Object.assign(base.settings,d.settings||{}),total:Object.assign(base.total,d.total||{})});
}
const store=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}

let ac=null,master=null;const SND={};
function ensureAudio(){
  try{
    if(!ac){
      const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
      ac=new C();master=ac.createGain();master.gain.value=.9;master.connect(ac.destination);
      Object.keys(window.SFX_SRC||{}).forEach(k=>{
        const url=window.SFX_SRC[k],bin=atob(url.slice(url.indexOf(',')+1)),buf=new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);
        ac.decodeAudioData(buf.buffer,d=>{SND[k]=d;},()=>{});
      });
    }
    if(ac.state==='suspended')ac.resume();
  }catch(e){}
}
function sfx(name,o){
  o=o||{};
  if(!store.settings.sfx||!ac||!SND[name])return;
  try{
    const s=ac.createBufferSource();s.buffer=SND[name];s.playbackRate.value=o.rate||1;
    const g=ac.createGain();g.gain.value=o.vol==null?1:o.vol;
    s.connect(g);g.connect(master);s.start(ac.currentTime+(o.delay||0));
  }catch(e){}
}

];
const T=n=>Math.floor(n/10),O=n=>n%10;
function mk(op,a,b){return {op,a,b,ans:op==='add'?a+b:op==='sub'?a-b:a};}
const GEN={
  count(){let n;do{n=ri(11,99);}while(n%10===0&&Math.random()<.6);return mk('count',n,0);},
  add21(){let a,b;do{a=ri(10,89);b=ri(1,9);}while(O(a)+b>9);return mk('add',a,b);},
  add22(){let a,b;do{a=ri(10,88);b=ri(10,88);}while(T(a)+T(b)>9||O(a)+O(b)>9||(O(a)===0&&O(b)===0&&Math.random()<.8));return mk('add',a,b);},
  sub21(){let a,b;do{a=ri(11,99);b=ri(1,9);}while(b>O(a));return mk('sub',a,b);},
  sub22(){let a,b;do{a=ri(21,99);b=ri(10,a-1);}while(O(b)>O(a)||T(b)>T(a)||(O(b)===0&&Math.random()<.7));return mk('sub',a,b);},
  addC(){let a,b;if(Math.random()<.45){do{a=ri(11,89);b=ri(2,9);}while(O(a)+b<10||a+b>99);}else{do{a=ri(11,78);b=ri(11,78);}while(O(a)+O(b)<10||a+b>99);}return mk('add',a,b);},
  subB(){let a,b;if(Math.random()<.45){do{a=ri(20,99);b=ri(2,9);}while(b<=O(a));}else{do{a=ri(21,98);b=ri(11,a-2);}while(O(b)<=O(a)||T(b)>=T(a));}return mk('sub',a,b);},
  mix(){return GEN[pick(['add22','sub22','addC','subB','addC','subB'])]();}
};
function makeRound(st,n){
  const out=[],seen=new Set();let guard=0;
  while(out.length<n&&guard++<500){const p=GEN[st.gen]();const k=p.op+p.a+'_'+p.b;if(seen.has(k))continue;seen.add(k);out.push(p);}
  return out;
}
function choicesFor(p){
  const ans=p.ans,c=[];
  if(p.op==='add'&&O(p.a)+O(p.b)>=10)c.push(ans-10);
  if(p.op==='sub'&&O(p.b)>O(p.a))c.push((T(p.a)-T(p.b))*10+(O(p.b)-O(p.a)));
  if(p.op==='count'&&O(ans)>0&&O(ans)!==T(ans))c.push(O(ans)*10+T(ans));
  const pool=shuffle([ans+10,ans-10,ans+1,ans-1,ans+2,ans-2,ans+11,ans-9]);
  const out=[];
  for(const x of c.concat(pool)){if(x>=0&&x<=99&&x!==ans&&!out.includes(x))out.push(x);if(out.length===3)break;}
  return shuffle([ans].concat(out));
}
function eqHTML(p,showAns){
  const num=n=>n>=10?`<span class="t">${T(n)}</span><span class="o">${O(n)}</span>`:`<span class="o">${n}</span>`;
  const sym=p.op==='add'?'+':'−';
  return `${num(p.a)}<span class="op">${sym}</span>${num(p.b)}<span class="op">=</span>${showAns?`<span class="solved">${p.ans}</span>`:'<span class="q">?</span>'}`;
}
function batchim(n){return n%10===0?true:[1,3,6,7,8].includes(n%10);}
const jo=(n,a,b)=>batchim(n)?a:b;

const CH={tori:{w:$('#chTori'),paws:$('#pawsTori'),eye:[310,158]},bora:{w:$('#chBora'),paws:$('#pawsBora'),eye:[970,180]}};
let R=null,busy=false,handTimer=null,timerInt=null,nextTimer=null,lookTimer=null,countTone=0;

function setMood(which,mood,ms){
  const c=CH[which],svg=c.w.querySelector('.chr');
  svg.dataset.mood=mood;
  c.paws.classList.toggle('clap',mood==='happy');
  if(mood==='happy'||mood==='eat')hop(which);
  if(mood==='sad'){c.w.classList.remove('shake');void c.w.offsetWidth;c.w.classList.add('shake');}
  clearTimeout(c.t);if(ms)c.t=setTimeout(()=>{svg.dataset.mood='normal';c.paws.classList.remove('clap');},ms);
}
function hop(which){const w=CH[which].w;w.classList.remove('hop');void w.offsetWidth;w.classList.add('hop');clearTimeout(w._h);w._h=setTimeout(()=>w.classList.remove('hop'),560);}
// 눈동자가 누른 쿠키 쪽을 바라봄
function lookAt(x,y){
  for(const k in CH){const c=CH[k],dx=x-c.eye[0],dy=y-c.eye[1],d=Math.hypot(dx,dy)||1;c.w.style.setProperty('--lx',(dx/d*4).toFixed(2));c.w.style.setProperty('--ly',(dy/d*4).toFixed(2));}
  clearTimeout(lookTimer);lookTimer=setTimeout(()=>{for(const k in CH){CH[k].w.style.setProperty('--lx',0);CH[k].w.style.setProperty('--ly',0);}},2200);
}
function setBub(el,html){el.innerHTML=html;el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
const numHTML=n=>`<span class="num">${n}</span>`;
const QBOX='<span class="qbox">?</span>';
function toStage(r){const s=stage.getBoundingClientRect();return {x:(r.left-s.left)/S,y:(r.top-s.top)/S,w:r.width/S,h:r.height/S};}
function sceneXY(el){const r=toStage(el.getBoundingClientRect());return {x:r.x,y:r.y-60,w:r.w,h:r.h};}
function center(el){const r=sceneXY(el);return {x:r.x+r.w/2,y:r.y+r.h/2,top:r.y,bottom:r.y+r.h};}

// FLIP: 모든 쿠키 위치를 기억했다가 DOM을 바꾼 뒤 부드럽게 이동
function flip(mutate,mover){
  const els=[...scene.querySelectorAll('.item')],before=new Map();
  els.forEach(e=>before.set(e,e.getBoundingClientRect()));
  mutate();
  let moverAnim=null;
  scene.querySelectorAll('.item').forEach(e=>{
    const b=before.get(e);if(!b)return;
    const a=e.getBoundingClientRect(),dx=(b.left-a.left)/S,dy=(b.top-a.top)/S;
    if(Math.abs(dx)<1&&Math.abs(dy)<1)return;
    if(e===mover){
      const rot=e.classList.contains('rod')?0:360,tilt=e.classList.contains('rod')?(dx>0?-14:14):0;
      moverAnim=e.animate([
        {transform:`translate(${dx}px,${dy}px) rotate(0deg) scale(1)`},
        {transform:`translate(${dx*.5}px,${dy*.5-95}px) rotate(${rot/2+tilt}deg) scale(1.3)`,offset:.5},
        {transform:'translate(0,0) rotate('+rot+'deg) scale(1)'}
      ],{duration:560,easing:'cubic-bezier(.45,.05,.55,.95)'});
    }else{
      e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:380,easing:'cubic-bezier(.25,.9,.35,1.15)'});
    }
  });
  return moverAnim?moverAnim.finished.catch(()=>{}):Promise.resolve();
}
function squash(el){return el.animate([{transform:'scale(1.2,.76)'},{transform:'scale(.93,1.1)'},{transform:'scale(1.03,.97)'},{transform:'none'}],{duration:340,easing:'ease-out'}).finished.catch(()=>{});}
function puff(el){
  const c=center(el);
  for(let i=0;i<6;i++){const p=document.createElement('span');p.className='puff';const a=Math.PI*(i/5),d=rnd(18,30);
    p.style.left=(c.x-7+Math.cos(a)*10)+'px';p.style.top=(c.bottom-12)+'px';p.style.setProperty('--dx',Math.cos(a)*d+'px');p.style.setProperty('--dy',(-Math.sin(a)*8)+'px');
    fx.appendChild(p);setTimeout(()=>p.remove(),500);}
}
function wiggle(el){el.animate([{transform:'rotate(0)'},{transform:'rotate(-10deg)'},{transform:'rotate(10deg)'},{transform:'rotate(-6deg)'},{transform:'rotate(0)'}],{duration:420});}
function hopEl(el,h){return el.animate([{transform:'translateY(0)'},{transform:`translateY(${-(h||14)}px) scale(1.06)`},{transform:'translateY(0)'}],{duration:260,easing:'ease-out'}).finished.catch(()=>{});}
function sparks(x,y,n){
  const colors=['#ffd23c','#ff7aa5','#7fd6ff','#9ef07a','#c59bff'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span');s.className='spark';s.textContent='★';
    const ang=Math.random()*Math.PI*2,dist=70+Math.random()*120;
    s.style.left=x+'px';s.style.top=y+'px';s.style.color=pick(colors);
    s.style.setProperty('--dx',Math.cos(ang)*dist+'px');s.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    s.style.fontSize=(18+Math.random()*20)+'px';
    fx.appendChild(s);setTimeout(()=>s.remove(),950);
  }
}
function confettiBurst(x,y,n){
  const cols=['#ffd23c','#ff7aa5','#7fd6ff','#9ef07a','#c59bff','#ff9f43'];
  for(let i=0;i<n;i++){
    const c=document.createElement('span');c.className='conf';
    const a=rnd(-Math.PI*.95,-Math.PI*.05),v=rnd(160,380);
    c.style.left=x+'px';c.style.top=y+'px';c.style.background=pick(cols);
    c.style.setProperty('--dx',Math.cos(a)*v+'px');c.style.setProperty('--dy',Math.sin(a)*v+'px');c.style.setProperty('--r',ri(-720,720)+'deg');
    c.style.animationDelay=rnd(0,.12)+'s';
    fx.appendChild(c);setTimeout(()=>c.remove(),1700);
  }
}
function crumbs(x,y){for(let i=0;i<7;i++){const c=document.createElement('span');c.className='crumb';c.style.left=(x+rnd(-14,14))+'px';c.style.top=(y+rnd(-4,4))+'px';c.style.setProperty('--dx',rnd(-30,30)+'px');c.style.background=pick(['#c98236','#e8a54b','#8a4a1e']);fx.appendChild(c);setTimeout(()=>c.remove(),750);}}
function floatText(x,y,txt,sm){const d=document.createElement('div');d.className='floattxt'+(sm?' sm':'');d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';fx.appendChild(d);setTimeout(()=>d.remove(),1150);}
function floatAt(el,txt,sm){const c=center(el);floatText(c.x,c.top-(sm?18:30),txt,sm);}
function banner(txt){const b=document.createElement('div');b.className='banner';b.textContent=txt;fx.appendChild(b);setTimeout(()=>b.remove(),1550);}

function startRound(st,list){
  ensureAudio();
  R={stage:st,review:!!list,probs:list?list.map(p=>Object.assign({},p)):makeRound(st,store.settings.count),i:0,results:[],t0:performance.now(),bundleTold:false,unpackTold:false};
  $('#playTitle').textContent=(list?'다시 풀기 · ':'')+`${st.id}단계 · ${st.title}`;
  clearInterval(timerInt);
  timerInt=setInterval(()=>{if(R)$('#timerTxt').textContent=fmtTime(performance.now()-R.t0);},500);
  $('#timerTxt').textContent='00:00';
  starWipe(()=>{show('scrPlay');startProblem();});
}
function updateProgress(){
  const N=R.probs.length;$('#progTxt').textContent=`${Math.min(R.i+1,N)}/${N}`;
  $('#progFill').style.width=`calc(${(R.i/N)*100}% - 6px)`;
}
function inputMode(){return R.stage.challenge?'keypad':store.settings.input;}

function startProblem(){
  const p=R.p=R.probs[R.i];
  R.phase='intro';R.attempts=0;R.typed='';R.counted=0;R.fed=false;R.remaining=p.op==='sub'?p.b:0;
  busy=false;hideHand();clearTimeout(nextTimer);countTone=0;
  explain.classList.remove('on');explain.innerHTML='';fx.innerHTML='';
  scene.classList.toggle('mode-count',p.op==='count');
  R.type=pick(CK_TYPES);
  updateProgress();
  setMood('tori','normal');setMood('bora','normal');
  [PL,PR].forEach(P=>{P.rods.innerHTML='';P.sgrid.innerHTML='';layoutSingles(P);});
  const fill=(P,n)=>{for(let i=0;i<T(n);i++)P.rods.appendChild(makeRod(R.type));for(let i=0;i<O(n);i++)P.sgrid.appendChild(makeCookie(R.type));layoutSingles(P);};
  if(p.op==='count'){
    fill(PL,p.a);
    setBub(bubL,QBOX);labL.textContent='모두 몇 개?';
    setBub(bubR,numHTML(0));labR.textContent='센 수';
    eqBoard.innerHTML=countBoard();
  }else if(p.op==='add'){
    fill(PL,p.a);fill(PR,p.b);
    setBub(bubL,numHTML(p.a));labL.textContent='토리 쿠키';
    setBub(bubR,numHTML(p.b));labR.textContent='보라 쿠키';
    eqBoard.innerHTML=eqHTML(p,false);
  }else{
    fill(PL,p.a);
    setBub(bubL,numHTML(p.a));labL.textContent='토리 쿠키';
    setBub(bubR,numHTML(p.b));labR.textContent='보라가 먹을 쿠키';
    eqBoard.innerHTML=eqHTML(p,false);
  }
  // 위에서 톡톡 떨어지며 등장
  [...scene.querySelectorAll('.item')].forEach((e,i)=>{
    e.animate([{transform:'translateY(-170px) scale(.7)',opacity:0},{transform:'translateY(0) scale(1)',opacity:1,offset:.6},{transform:'scale(1.16,.8)',offset:.75},{transform:'scale(.95,1.06)',offset:.88},{transform:'none'}],{duration:620,delay:i*38,easing:'ease-in',fill:'backwards'});
    if(i%3===0)sfx('land',{vol:.35,rate:rnd(.9,1.15),delay:(i*38+370)/1000});
  });
  if(R.stage.challenge){R.phase='answer';showAnswerUI();return;}
  R.phase='act';
  let txt;
  if(p.op==='count')txt='10개 묶음부터 하나씩 눌러서 세어 보아요';
  else if(p.op==='add')txt='보라 쿠키를 눌러서 토리 접시로 옮겨요';
  else txt=`토리 쿠키를 눌러서 보라에게 ${p.b}개 주세요`;
  showPrompt(txt);
  armHand(R.i===0?1600:3200);
}
function countBoard(){
  const t=PL.rods.querySelectorAll('.counted').length,o=PL.sgrid.querySelectorAll('.counted').length;
  return `<span class="lbl">묶음</span><span class="t">${R.counted?t:'?'}</span><span class="lbl" style="margin-left:14px">낱개</span><span class="o">${R.counted?o:'?'}</span>`;
}
function showPrompt(txt){
  dock.innerHTML=`<div class="prompt"><span class="ic"><svg viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V11m0-1.5a1.5 1.5 0 0 1 3 0V11m0-.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-5-2.7L3.5 14a1.5 1.5 0 0 1 2.4-1.8L9 15" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>${txt}</span></div>`;
}

/* 손가락 힌트 */
function hideHand(){hand.classList.remove('on');clearTimeout(handTimer);}
function armHand(ms){clearTimeout(handTimer);handTimer=setTimeout(showHand,ms);}
function handTarget(){
  const p=R.p;
  if(p.op==='count')return PL.rods.querySelector('.item:not(.counted)')||PL.sgrid.querySelector('.item:not(.counted)');
  if(p.op==='add')return PR.rods.lastElementChild||PR.sgrid.lastElementChild;
  if(R.remaining<=0)return null;
  if(R.remaining>=10)return PL.rods.lastElementChild;
  return PL.sgrid.lastElementChild||PL.rods.lastElementChild;
}
function showHand(){
  if(!R||R.phase!=='act'||busy)return;
  const t=handTarget();if(!t)return;
  const r=sceneXY(t);
  hand.style.left=(r.x+r.w/2-22)+'px';hand.style.top=(r.y+Math.min(r.h/2,60)-4)+'px';
  hand.classList.add('on');
  armHand(7000);
}

/* 쿠키 누르기 */
scene.addEventListener('pointerdown',e=>{
  const it=e.target.closest('.item');if(!it||!R||busy)return;
  const p=R.p,c=center(it);lookAt(c.x,c.y);
  const canAct=R.phase==='act'||(R.phase==='answer'&&R.stage.challenge&&p.op!=='count');
  if(!canAct){wiggle(it);return;}
  ensureAudio();hideHand();if(R.phase==='act')armHand(7000);
  it.animate([{transform:'scale(1)'},{transform:'scale(.88)'},{transform:'scale(1)'}],{duration:140});
  const side=it.closest('.plate')===PL.el?'L':'R';
  if(p.op==='count')onCountTap(it);
  else if(p.op==='add')onAddTap(it,side);
  else onSubTap(it,side);
});
function onCountTap(it){
  if(it.classList.contains('counted')){wiggle(it);return;}
  const isRod=it.classList.contains('rod');
  if(!isRod&&PL.rods.querySelector('.item:not(.counted)')){
    PL.rods.querySelectorAll('.item:not(.counted)').forEach(wiggle);sfx('boop');floatAt(PL.rods.querySelector('.item:not(.counted)'),'묶음부터!');return;
  }
  R.counted+=isRod?10:1;
  it.classList.add('counted');
  const b=document.createElement('span');b.className='badge';b.textContent=R.counted;it.appendChild(b);
  hopEl(it,isRod?12:16);
  sfx('tick',{rate:semi(PENTA[Math.min(PENTA.length-1,countTone++)])});
  setBub(bubR,numHTML(R.counted));eqBoard.innerHTML=countBoard();
  setMood('bora','happy',600);
  if(!scene.querySelector('#plateL .item:not(.counted)')){setTimeout(()=>{setMood('tori','wow',900);toAnswer();},800);}
}
function moveItem(it,to){
  const from=it.closest('.plate')===PL.el?PL:PR,isRod=it.classList.contains('rod');
  sfx('pick',{rate:rnd(.95,1.1)});if(isRod)sfx('whoosh',{vol:.45});
  return flip(()=>{
    if(isRod)to.rods.appendChild(it);else to.sgrid.appendChild(it);
    layoutSingles(from);layoutSingles(to);
  },it).then(()=>{sfx('land',{vol:.8,rate:rnd(.9,1.12)});puff(it);return squash(it);});
}
async function onAddTap(it,side){
  if(side==='L'){wiggle(it);sfx('boop');floatAt(it,'보라 쿠키를 눌러요',true);return;}
  const isRod=it.classList.contains('rod');
  const willBundle=!isRod&&nSingles(PL)===9;
  if(willBundle)busy=true;
  const done=moveItem(it,PL);
  done.then(()=>setMood('tori','happy',700));
  if(R.phase==='act'&&bubL.textContent!=='?'){setBub(bubL,QBOX);labL.textContent='모두 몇 개?';}
  if(willBundle){await done;await bundle(PL,false);busy=false;}
  if(R.phase==='act'&&nRods(PR)+nSingles(PR)===0){await done;setTimeout(toAnswer,450);}
}
async function onSubTap(it,side){
  if(side==='R'){wiggle(it);return;}
  if(R.remaining<=0){wiggle(it);sfx('boop');return;}
  const isRod=it.classList.contains('rod');
  if(isRod){
    if(R.remaining>=10){R.remaining-=10;give(it);}
    else if(nSingles(PL)>=R.remaining){sfx('boop');wiggle(it);PL.sgrid.querySelectorAll('.item').forEach(el=>hopEl(el,10));floatAt(it,'낱개로 줄 수 있어요',true);return;}
    else{busy=true;await unpack(PL,it);busy=false;if(R.phase==='act')armHand(4000);return;}
  }else{
    R.remaining-=1;
    const willBundle=nSingles(PR)===9;
    if(willBundle)busy=true;
    const done=give(it);
    if(willBundle){await done;await bundle(PR,true);busy=false;}
  }
  if(R.remaining===0&&!R.fed){
    R.fed=true;
    setBub(bubR,'<span class="num" style="font-size:38px">고마워!</span>');
    if(R.phase==='act')setTimeout(toAnswer,900);
  }
}
function give(it){
  const done=moveItem(it,PR);
  done.then(()=>{sfx('nom',{vol:.8});setMood('bora','eat',800);crumbs(970,150);});
  if(R.remaining>0)setBub(bubR,numHTML(R.remaining));
  if(R.phase==='act'&&bubL.textContent!=='?'){setBub(bubL,QBOX);labL.textContent='남은 쿠키';}
  return done;
}
// 낱개 10개 → 묶음 1개 (받아올림)
async function bundle(P,quiet){
  const singles=[...P.sgrid.children].slice(0,10);
  setMood('tori','wow',2200);setMood('bora','wow',2200);
  for(let i=0;i<10;i++){singles[i].classList.add('glow');hopEl(singles[i],12);floatAt(singles[i],String(i+1),true);sfx('tick',{rate:semi(PENTA[i]),vol:.7});await wait(85);}
  if(!quiet)banner(R.bundleTold?'10개는 한 묶음!':'10개가 모이면 한 묶음!');R.bundleTold=true;
  await wait(250);
  const rod=makeRod(R.type);rod.style.opacity='0';
  flip(()=>P.rods.appendChild(rod));
  await wait(400);
  const rr=sceneXY(rod);
  await Promise.all(singles.map((s,i)=>{
    const sr=sceneXY(s);
    const tx=rr.x+rr.w/2-(sr.x+sr.w/2),ty=rr.y+rr.h-18-i*14-(sr.y+sr.h/2);
    return s.animate([{transform:'none'},{transform:`translate(${tx*.5}px,${ty*.5-50}px) scale(1.1)`,offset:.5},{transform:`translate(${tx}px,${ty}px) scale(.7,.5)`}],{duration:460,delay:i*40,easing:'ease-in-out',fill:'forwards'}).finished.catch(()=>{});
  }));
  singles.forEach(s=>s.remove());
  rod.style.opacity='';rod.classList.add('wrap');
  sfx('bundle');squash(rod);
  flip(()=>layoutSingles(P));
  sparks(rr.x+rr.w/2,rr.y+rr.h/2,14);floatText(rr.x+rr.w/2,rr.y-24,'10개 묶음!');
  setMood('tori','happy',900);setMood('bora','happy',900);
  await wait(450);
}
// 묶음 1개 → 낱개 10개 (받아내림)
async function unpack(P,rod){
  sfx('unpack');setMood('tori','wow',1500);
  banner(R.unpackTold?'한 묶음을 풀어요!':'낱개가 모자라요! 한 묶음을 풀어요');R.unpackTold=true;
  await rod.animate([{transform:'rotate(0)'},{transform:'rotate(-8deg) scale(1.08)'},{transform:'rotate(8deg) scale(1.08)'},{transform:'rotate(-5deg) scale(1.12)'},{transform:'rotate(0) scale(1.15)'}],{duration:480}).finished.catch(()=>{});
  rod.classList.add('snap');
  await wait(220);
  const rr=sceneXY(rod);
  const news=[];
  flip(()=>{rod.remove();for(let i=0;i<10;i++){const c=makeCookie(R.type);P.sgrid.appendChild(c);news.push(c);}layoutSingles(P);});
  news.forEach((c,i)=>{
    const cr=sceneXY(c);
    const dx=rr.x+rr.w/2-(cr.x+cr.w/2),dy=rr.y+rr.h-18-i*14-(cr.y+cr.h/2);
    c.animate([{transform:`translate(${dx}px,${dy}px) scale(.7,.5)`},{transform:`translate(${dx*.5}px,${dy*.5-60}px) rotate(180deg) scale(1.1)`,offset:.5},{transform:'none'}],{duration:560,delay:i*45,easing:'ease-out',fill:'backwards'});
  });
  sparks(rr.x+rr.w/2,rr.y+rr.h/2,10);floatText(rr.x+rr.w/2,rr.y-10,'낱개 10개!');
  await wait(1000);
  sfx('land',{vol:.5});
}

/* 답하기 */
function toAnswer(){
  if(!R||R.phase!=='act')return;
  R.phase='answer';hideHand();
  setBub(bubL,QBOX);
  labL.textContent=R.p.op==='sub'?'남은 쿠키':'모두 몇 개?';
  showAnswerUI();
}
function showAnswerUI(){
  if(R.stage.challenge){setBub(bubL,QBOX);labL.textContent='답';}
  if(inputMode()==='keypad'){
    dock.innerHTML=`<div class="kp">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button type="button" class="key" data-k="${n}">${n}</button>`).join('')}<button type="button" class="key del" data-k="del">지우기</button><button type="button" class="key ok" data-k="ok">확인</button></div>`;
    dock.querySelectorAll('.key').forEach(b=>b.onclick=()=>onKey(b.dataset.k));
    renderTyped();
  }else{
    dock.innerHTML=choicesFor(R.p).map((v,i)=>`<button type="button" class="ans" data-v="${v}" style="animation-delay:${i*70}ms">${v}</button>`).join('');
    dock.querySelectorAll('.ans').forEach(b=>b.onclick=()=>checkAnswer(+b.dataset.v,b));
  }
}
function renderTyped(){
  const ghost=R.attempts>=2&&!R.typed?`<span class="ghost">${R.p.ans}</span>`:'';
  bubL.innerHTML=`<span class="qbox ${R.typed||ghost?'typed':''}">${R.typed||ghost||'?'}</span>`;
}
function onKey(k){
  if(!R||R.phase!=='answer'||busy)return;
  sfx('click');
  if(k==='del'){R.typed=R.typed.slice(0,-1);}
  else if(k==='ok'){if(R.typed!=='')checkAnswer(+R.typed,null);return;}
  else{if(R.typed.length>=2)R.typed='';if(R.typed==='0')R.typed='';R.typed+=k;}
  renderTyped();
}
function checkAnswer(v,btn){
  if(!R||R.phase!=='answer'||busy)return;
  ensureAudio();
  if(v===R.p.ans){onCorrect(btn);return;}
  R.attempts++;
  sfx('wrong');setMood('tori','sad',1300);setMood('bora','sad',1300);
  const x=document.createElement('div');x.className='xmark';fx.appendChild(x);setTimeout(()=>x.remove(),950);
  if(btn)btn.classList.add('wrong');
  else{R.typed='';renderTyped();bubL.animate([{transform:'translateX(0)'},{transform:'translateX(-10px)'},{transform:'translateX(10px)'},{transform:'translateX(0)'}],{duration:300});}
  if(R.attempts>=2){
    if(btn){const c=dock.querySelector(`.ans[data-v="${R.p.ans}"]`);c&&c.classList.add('pulse');}
    else renderTyped();
  }
}
async function onCorrect(btn){
  R.phase='explain';busy=true;hideHand();
  const p=R.p,first=R.attempts===0;
  R.results.push({p,ok:first});
  store.total.solved++;if(first)store.total.correct++;store.today++;save();
  sfx('correct');
  if(btn){btn.classList.remove('pulse');btn.classList.add('right');}
  dock.querySelectorAll('.ans').forEach(b=>{if(b!==btn)b.style.opacity='.45';});
  const ring=document.createElement('div');ring.className='okring';fx.appendChild(ring);
  sparks(640,250,22);confettiBurst(640,260,46);
  setMood('tori','happy',2600);setMood('bora','happy',2600);setTimeout(()=>hop('bora'),160);
  setBub(bubL,numHTML(p.ans));
  bubL.style.color='var(--bora)';setTimeout(()=>bubL.style.color='',2400);
  if(p.op!=='count')eqBoard.innerHTML=eqHTML(p,true);
  await wait(1150);ring.remove();
  showExplain();
  busy=false;
}

/* 풀이 설명 */
function showExplain(){
  const p=R.p;let h='';
  if(p.op!=='count'){
    h+=`<div class="xb l">${p.a}</div><div class="xb r">${p.ans}</div>
      <div class="arrlabel">${p.b}만큼 ${p.op==='add'?'큰':'작은'} 수</div>
      <div class="arr" id="arr"><div class="track"></div><div class="afill"></div><div class="head"></div></div>`;
    h+=`<div class="vcard">${verticalHTML(p)}<div class="vsteps">${stepsHTML(p)}</div></div>`;
  }else{
    const t=T(p.a),o=O(p.a);
    h+=`<div class="vcard" style="flex-direction:column;align-items:flex-start;justify-content:center;gap:14px">
      <div class="cntrow pin" style="--d:.15s"><div class="miniset">${'<i class="mr"></i>'.repeat(t)}</div><span>10개 묶음 <b style="color:var(--tens);font-weight:400">${t}</b>개 → <b style="color:var(--tens);font-weight:400">${t*10}</b></span></div>
      <div class="cntrow pin" style="--d:.7s"><div class="miniset">${'<i class="mc"></i>'.repeat(o)}</div><span>낱개 <b style="color:var(--ones);font-weight:400">${o}</b>개 → <b style="color:var(--ones);font-weight:400">${o}</b></span></div>
      <div class="cntrow pin" style="--d:1.3s;font-size:44px">${t*10}${jo(t*10,'과','와')} ${o} → <span><span style="color:var(--tens)">${t}</span><span style="color:var(--ones)">${o}</span></span></div></div>`;
  }
  explain.innerHTML=h;explain.classList.add('on');labL.textContent='';labR.textContent='';
  const arr=$('#arr');if(arr){requestAnimationFrame(()=>arr.classList.add('go'));setTimeout(()=>sfx('whoosh',{vol:.5}),200);}
  const last=R.i>=R.probs.length-1;
  dock.innerHTML=`<button type="button" class="nextbtn" id="nextBtn"><div class="tm" id="nextTm"></div><span>${last?'결과 보기 ▶':'다음 문제 ▶'}</span></button>`;
  const DUR=7000;
  $('#nextTm').animate([{width:'0%'},{width:'100%'}],{duration:DUR,easing:'linear',fill:'forwards'});
  const go=()=>{clearTimeout(nextTimer);sfx('click');nextProblem();};
  $('#nextBtn').onclick=go;
  nextTimer=setTimeout(()=>{if(!window.__holdNext)go();},DUR);
}
function verticalHTML(p){
  const a1=T(p.a),a0=O(p.a),b1=T(p.b),b0=O(p.b),c1=T(p.ans),c0=O(p.ans);
  const carry=p.op==='add'&&a0+b0>=10,borrow=p.op==='sub'&&b0>a0;
  const sym=p.op==='add'?'+':'−';
  const cell=(txt,cls,d)=>`<div class="${cls||''}${d!=null?' pin':''}" ${d!=null?`style="--d:${d}s"`:''}>${txt}</div>`;
  let h='<div class="vg">';
  h+=cell('')+'<div class="hd t">십</div><div class="hd o">일</div>';
  h+=cell('')+(carry?cell('1','mk',1.3):borrow?cell(a1-1,'mk',.7):cell(''))+(borrow?cell('10','mk',.7):cell(''));
  h+=cell('')+`<div class="t ${borrow?'strike':''}" style="--d:.6s">${a1||''}</div>`+cell(a0,'o');
  h+=cell(sym,'op')+cell(b1||'','t')+cell(b0,'o');
  h+='<div class="line"></div>';
  h+=cell('')+cell(c1||'','t res',2.0)+cell(c0,'o res',1.2);
  return h+'</div>';
}
function stepsHTML(p){
  const a1=T(p.a),a0=O(p.a),b1=T(p.b),b0=O(p.b);
  const st=(d,tag,cls,txt)=>`<div class="st pin" style="--d:${d}s"><b class="${cls}">${tag}</b><span>${txt}</span></div>`;
  let h='';
  if(p.op==='add'){
    h+=st(.5,'일','o',`${a0} + ${b0} = ${a0+b0}`);
    if(a0+b0>=10){h+=st(1.2,'올림','r','10은 십의 자리로 1 받아올림!');h+=st(1.9,'십','t',`1 + ${a1}${b1?' + '+b1:''} = ${1+a1+b1}`);}
    else h+=st(1.6,'십','t',b1?`${a1} + ${b1} = ${a1+b1}`:`${a1} 그대로 내려요`);
  }else if(b0>a0){
    h+=st(.5,'빌림','r',`${a0} − ${b0} 못 해요! 10을 빌려와요`);
    h+=st(1.2,'일','o',`${10+a0} − ${b0} = ${10+a0-b0}`);
    h+=st(1.9,'십','t',b1?`${a1-1} − ${b1} = ${a1-1-b1}`:`${a1-1} 그대로 내려요`);
  }else{
    h+=st(.5,'일','o',`${a0} − ${b0} = ${a0-b0}`);
    h+=st(1.6,'십','t',b1?`${a1} − ${b1} = ${a1-b1}`:`${a1} 그대로 내려요`);
  }
  h+=`<div class="st big pin" style="--d:2.4s">${p.a} ${p.op==='add'?'+':'−'} ${p.b} = <span style="color:var(--bora)">${p.ans}</span></div>`;
  return h;
}
function nextProblem(){
  if(!R)return;
  clearTimeout(nextTimer);
  R.i++;
  if(R.i>=R.probs.length){finishRound();return;}
  startProblem();
}

/* 그만하기 */
$('#btnBack').onclick=()=>{
  sfx('click');
  openModal(`<h2>그만할까요?</h2><p>지금까지 푼 문제는 기록되지 않아요.</p>
    <div class="mbtns"><button type="button" class="cbtn" data-a="quit">그만하기</button><button type="button" class="cbtn main" data-a="stay">계속하기</button></div>`,
    {stay:closeModal,quit:()=>{closeModal();quitRound();}});
};
function quitRound(){
  clearInterval(timerInt);clearTimeout(nextTimer);hideHand();R=null;
  starWipe(()=>{renderMap();show('scrMap');});
}

/* ---------------- 결과 ---------------- */
function finishRound(){
  clearInterval(timerInt);
  const ms=performance.now()-R.t0,N=R.results.length,ok=R.results.filter(r=>r.ok).length;
  const acc=N?ok/N:0,stars=acc===1?3:acc>=.75?2:1;
  const wrong=R.results.filter(r=>!r.ok).map(r=>r.p);
  const st=R.stage,review=R.review;
  const rewards=[['오늘의 학습',review?3:5]];
  if(acc===1&&!review)rewards.push(['정확도 100%',5]);
  store.gems+=rewards.reduce((s,r)=>s+r[1],0);
  if(!review&&stars>(store.stars[st.id]||0))store.stars[st.id]=stars;
  save();
  R=null;
  starWipe(()=>{
    show('scrClear');
    $('#podTori').innerHTML=`<div class="chr-wrap">${toriSVG()}</div>`;$('#podTori .chr').dataset.mood='happy';
    $('#podBora').innerHTML=`<div class="chr-wrap">${boraSVG()}</div>`;$('#podBora .chr').dataset.mood='happy';
    $('#clearMsg').textContent=acc===1?'모두 한 번에 맞혔어요! 완벽해요!':acc>=.75?'정말 잘했어요!':'끝까지 잘 해냈어요!';
    $('#clearStars').innerHTML=[1,2,3].map(i=>{const on=!review&&i<=stars;return starSVG(on).replace('<svg',`<svg class="${on?'on':''}" style="animation-delay:${.5+i*.3}s"`);}).join('');
    $('#clearStats').innerHTML=`<span class="k">걸린 시간</span><span>${fmtTime(ms)}</span><span class="k">문제 수</span><span>${N}문제</span><span class="k">한 번에 정답</span><span>${Math.round(acc*100)}%</span>`;
    $('#clearRewards').innerHTML=rewards.map(([t,n],i)=>`<div class="rcard" style="animation-delay:${1.4+i*.25}s"><svg viewBox="0 0 40 40"><use href="#i-gem"/></svg><b>×${n}</b>${t}</div>`).join('');
    let bh=`<button type="button" class="cbtn" id="cbAgain">다시 하기</button>`;
    if(wrong.length)bh+=`<button type="button" class="cbtn alt" id="cbWrong">틀린 문제 다시</button>`;
    bh+=`<button type="button" class="cbtn main" id="cbOk">확인</button>`;
    $('#clearBtns').innerHTML=bh;
    $('#cbAgain').onclick=()=>{sfx('click');startRound(st);};
    if(wrong.length)$('#cbWrong').onclick=()=>{sfx('click');startRound(st,wrong);};
    $('#cbOk').onclick=()=>{sfx('click');starWipe(()=>{renderMap();show('scrMap');});};
    buildClearDeco();
    sfx('fanfare');confetti($('#confetti'));
    if(!review)[1,2,3].forEach(i=>{if(i<=stars)sfx('star',{rate:semi([0,4,7][i-1]),delay:.8+i*.3});});
    rewards.forEach((r,i)=>sfx('gem',{delay:1.5+i*.25,vol:.7}));
  });
}
function buildClearDeco(){
  let h='';
  [[60,120,70],[520,80,40],[1180,560,90],[560,600,50],[1230,140,46],[40,560,56]].forEach(([x,y,s],i)=>h+=`<div class="bubbleo" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;animation-delay:${i*.5}s"></div>`);
  [[110,90],[260,150],[420,70],[1240,60]].forEach(([x,h2])=>h+=`<div class="hangstar" style="left:${x}px;height:${h2}px"><svg viewBox="0 0 40 40"><use href="#i-star" fill="#fff6b0" stroke="#fff" stroke-width="1"/></svg></div>`);
  $('#clearDeco').innerHTML=h;
}
function confetti(box){
  const cols=['#ffd23c','#ff7aa5','#7fd6ff','#9ef07a','#c59bff','#ff9f43'];
  box.innerHTML='';
  for(let i=0;i<70;i++){
    const c=document.createElement('i');
    c.style.left=Math.random()*1280+'px';c.style.background=pick(cols);
    c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=(Math.random()*.8)+'s';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    box.appendChild(c);
  }
  setTimeout(()=>{box.innerHTML='';},5000);
}

})();
</script>
