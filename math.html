<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="쿠키 셈놀이">
<title>토리의 쿠키 셈놀이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* 1280x720 고정 캔버스를 화면에 맞춰 확대/축소하는 앱형 레이아웃. 자리값 색: 십=파랑, 일=주황 */
:root{
  --navy:#1b2766; --navy-2:#2b3d92; --navy-deep:#0f1846;
  --sun:#ffc93c; --sun-d:#df9500;
  --green:#3cc22b; --green-d:#1f8a14;
  --tori:#f04347; --bora:#9a4ef0;
  --tens:#2d7ff9; --ones:#ff8a00;
  --ink:#3b2a4a; --paper:#ffffff;
  --table:#ffc4da; --dock:#f48ab3;
  --font:'Jua','Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#150d36}
body{font-family:var(--font);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{font-family:var(--font);color:inherit;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:focus-visible{outline:4px solid #fff;outline-offset:3px}
#app{position:fixed;inset:0;overflow:hidden;
  background:
    radial-gradient(1.5px 1.5px at 12% 18%,#fff 60%,transparent 70%),
    radial-gradient(1.2px 1.2px at 28% 72%,#cfc6ff 60%,transparent 70%),
    radial-gradient(1.8px 1.8px at 46% 30%,#fff 60%,transparent 70%),
    radial-gradient(1.2px 1.2px at 64% 84%,#fff 60%,transparent 70%),
    radial-gradient(1.6px 1.6px at 82% 22%,#e2dcff 60%,transparent 70%),
    radial-gradient(1.2px 1.2px at 92% 64%,#fff 60%,transparent 70%),
    radial-gradient(1.4px 1.4px at 6% 88%,#fff 60%,transparent 70%),
    radial-gradient(ellipse at 50% 120%,#3a1d7a,#150d36 70%);}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center center;overflow:hidden;background:#fff3b5;box-shadow:0 0 60px rgba(0,0,0,.5)}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}

/* ---------- 공통 상단바 ---------- */
.topbar{position:absolute;left:0;right:0;top:0;height:60px;background:linear-gradient(#26388a,#1b2766);display:flex;align-items:center;gap:12px;padding:0 14px;z-index:20;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.ibtn{width:44px;height:44px;flex:none;border-radius:13px;border:none;background:var(--sun);box-shadow:0 4px 0 var(--sun-d);display:grid;place-items:center;cursor:pointer;padding:0}
.ibtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--sun-d)}
.ibtn svg{width:26px;height:26px}
.tb-title{font-size:25px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.5px}
.pill{height:40px;border-radius:20px;background:var(--navy-deep);display:flex;align-items:center;justify-content:center;gap:8px;font-size:22px;padding:0 16px 0 10px;position:relative;overflow:hidden;font-variant-numeric:tabular-nums;flex:none}
.pill svg{width:26px;height:26px;flex:none;position:relative}
.pill span{position:relative}
.pill .fill{position:absolute;left:3px;top:3px;bottom:3px;border-radius:17px;background:linear-gradient(#ffbe45,#ff8d1c);width:0;transition:width .5s ease}

/* ---------- 놀이 화면 ---------- */
.scene{position:absolute;left:0;right:0;top:60px;height:500px;overflow:hidden}
.wall{position:absolute;left:0;right:0;top:0;height:190px;background:
  radial-gradient(circle at 20px 20px,rgba(255,255,255,.55) 5px,transparent 6px) 0 0/64px 64px,
  linear-gradient(#fff7c9,#ffe88c)}
.window{position:absolute;left:530px;top:6px;width:220px;height:128px;border-radius:14px;border:9px solid #c8916c;background:linear-gradient(#8fdcff,#d6f4ff 70%,#b7ec8f 71%,#8fd46a)}
.window::before,.window::after{content:'';position:absolute;background:#c8916c}
.window::before{left:50%;top:0;bottom:0;width:8px;margin-left:-4px}
.window::after{top:50%;left:0;right:0;height:8px;margin-top:-4px}
.curtain{position:absolute;top:0;width:44px;height:150px;background:linear-gradient(90deg,#a8e06a,#c9f08e);border-radius:0 0 22px 22px}
.curtain.l{left:500px}.curtain.r{left:736px}
.table{position:absolute;left:0;right:0;top:180px;bottom:0;z-index:2;background-color:var(--table);
  background-image:linear-gradient(90deg,rgba(255,255,255,.38) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.38) 50%,transparent 50%);
  background-size:52px 52px;border-top:8px solid #ffe0ec}
.chr-wrap{position:absolute;top:6px;width:200px;height:200px;z-index:1}
.chr-wrap.tori{left:215px}.chr-wrap.bora{left:865px}
.chr{width:100%;height:100%;display:block;overflow:visible}
.chr .bob{transform-origin:100px 200px;animation:breathe 2.6s ease-in-out infinite}
.chr-wrap.hop .bob{animation:hop .5s ease}
@keyframes breathe{0%,100%{transform:scale(1,1)}50%{transform:scale(1.02,.985)}}
@keyframes hop{0%{transform:translateY(0)}35%{transform:translateY(-22px) scale(1.04,.97)}70%{transform:translateY(0) scale(1.03,.95)}100%{transform:none}}
.chr .e-happy,.chr .e-sad,.chr .m-happy,.chr .m-sad{display:none}
.chr[data-mood=happy] .e-normal,.chr[data-mood=happy] .m-normal,.chr[data-mood=sad] .e-normal,.chr[data-mood=sad] .m-normal{display:none}
.chr[data-mood=happy] .e-happy,.chr[data-mood=happy] .m-happy,.chr[data-mood=sad] .e-sad,.chr[data-mood=sad] .m-sad{display:inline}

.bub{position:absolute;top:14px;width:136px;height:136px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:84px;line-height:1;z-index:4;box-shadow:0 6px 0 rgba(120,60,90,.12)}
.bub::after{content:'';position:absolute;bottom:-14px;left:50%;margin-left:-14px;border:14px solid transparent;border-top-color:#fff;border-bottom:0}
.bub.l{left:70px;color:var(--tori)}.bub.r{left:1074px;color:var(--bora)}
.bub .num{display:block;font-variant-numeric:tabular-nums}
.bub.small .num{font-size:66px}
.blabel{position:absolute;top:158px;width:136px;text-align:center;font-size:19px;z-index:4;color:#fff;background:rgba(80,40,110,.78);border-radius:14px;padding:3px 0}
.blabel.l{left:70px}.blabel.r{left:1074px}
.blabel:empty{display:none}
.qbox{display:grid;place-items:center;width:72px;height:86px;border:5px solid #e3263a;color:#e3263a;font-size:70px;border-radius:4px}
.qbox.typed{border-color:var(--bora);color:var(--bora);font-size:60px;width:96px}
.qbox .ghost{opacity:.3}
.bub.pop{animation:bubpop .35s ease}
@keyframes bubpop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}

.eq{position:absolute;left:460px;top:128px;width:360px;height:68px;z-index:4;background:linear-gradient(#3b7d5e,#2f6b4f);border:6px solid #c8916c;border-radius:14px;color:#fff;font-size:42px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 10px rgba(80,30,40,.25);white-space:nowrap}
.eq .t{color:#9ccbff}.eq .o{color:#ffcf7d}.eq .op{color:#fff;opacity:.9}
.eq .q{display:inline-grid;place-items:center;min-width:52px;height:50px;border:3px dashed rgba(255,255,255,.7);border-radius:8px;font-size:38px}
.eq .lbl{font-size:30px;opacity:.9}
.eq .solved{color:#c8ff9e}

.plate{position:absolute;top:204px;width:590px;height:280px;border-radius:140px;background:#fff;z-index:3;box-shadow:0 10px 0 #f3a3c3,0 16px 26px rgba(160,40,90,.25)}
.plate::before{content:'';position:absolute;inset:16px;border-radius:124px;background:radial-gradient(ellipse at 50% 35%,#f6fdff,#d5eff7)}
.plate.L{left:30px}.plate.R{left:660px}
.scene.mode-count .plate.L{left:345px}
.scene.mode-count .plate.R{display:none}
.inner{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;gap:22px;padding-bottom:40px}
.rods{display:flex;gap:5px;align-items:flex-end;min-height:198px}
.singles{position:relative;width:202px;height:184px;flex:none}
.tfbg{position:absolute;left:0;width:202px;height:80px;display:grid;grid-template-columns:repeat(5,38px);grid-template-rows:38px 38px;gap:4px}
.tfbg i{border:2px dashed rgba(70,140,175,.35);border-radius:10px}
.tfbg.f0{bottom:0}.tfbg.f1{top:0;display:none}
.singles.two .tfbg.f1{display:grid}
.sgrid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,38px);grid-template-rows:38px 38px 16px 38px 38px;gap:4px}
.item{position:relative;cursor:pointer;will-change:transform}
.ck{width:38px;height:38px}
.ck>svg{width:100%;height:100%;display:block;filter:drop-shadow(0 2px 0 rgba(120,60,20,.25))}
.rod{width:26px;height:198px}
.rod>svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 0 rgba(120,60,20,.25))}
.item.counted>svg{filter:drop-shadow(0 0 5px #ffd000) drop-shadow(0 0 2px #ffb300)}
.item.glow>svg{filter:drop-shadow(0 0 8px #fff36b) drop-shadow(0 0 3px #ffcf00)}
.badge{position:absolute;left:50%;transform:translateX(-50%);background:var(--sun);color:var(--ink);border-radius:10px;font-size:17px;padding:1px 6px;white-space:nowrap;box-shadow:0 2px 0 var(--sun-d);pointer-events:none}
.rod .badge{top:-30px;font-size:19px}
.ck .badge{top:-15px;font-size:14px;padding:0 4px}

.hand{position:absolute;left:0;top:0;width:64px;height:64px;z-index:30;pointer-events:none;display:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25))}
.hand.on{display:block;animation:handtap 1s ease-in-out infinite}
@keyframes handtap{0%,100%{translate:0 0}50%{translate:6px 14px}}

.fx{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.okring{position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;border:46px solid #4fd534;box-shadow:inset 0 0 0 5px rgba(255,255,255,.55),0 0 0 8px #fff,0 12px 22px rgba(0,0,0,.25);background:radial-gradient(circle,rgba(255,255,255,.35),transparent 60%);animation:okpop 1.1s ease forwards}
@keyframes okpop{0%{transform:scale(.2);opacity:0}25%{transform:scale(1.12);opacity:1}40%{transform:scale(1)}80%{transform:scale(1);opacity:1}100%{transform:scale(1.2);opacity:0}}
.xmark{position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;animation:okpop .9s ease forwards}
.xmark::before,.xmark::after{content:'';position:absolute;left:50%;top:50%;width:170px;height:38px;margin:-19px 0 0 -85px;border-radius:19px;background:#ff4a5a;box-shadow:0 0 0 6px #fff}
.xmark::before{transform:rotate(45deg)}.xmark::after{transform:rotate(-45deg)}
.spark{position:absolute;font-size:28px;line-height:1;animation:spark .9s ease-out forwards}
@keyframes spark{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(200deg);opacity:0}}
.floattxt{position:absolute;font-size:34px;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;animation:floatup 1s ease-out forwards;white-space:nowrap}
@keyframes floatup{0%{transform:translate(-50%,0) scale(.6);opacity:0}20%{transform:translate(-50%,-10px) scale(1.15);opacity:1}100%{transform:translate(-50%,-70px) scale(1);opacity:0}}

.explain{position:absolute;inset:0;z-index:35;display:none;background:rgba(45,20,70,.5)}
.explain.on{display:block;animation:fadein .3s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.xb{position:absolute;top:14px;width:136px;height:136px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:84px;box-shadow:0 0 0 6px rgba(255,255,255,.35)}
.xb.l{left:70px;color:var(--tori)}.xb.r{left:1074px;color:var(--bora)}
.arr{position:absolute;left:222px;top:70px;width:838px;height:26px}
.arr .track{position:absolute;left:0;right:34px;top:3px;height:20px;background:#fff;border-radius:4px}
.arr .afill{position:absolute;left:0;top:3px;height:20px;width:0;background:#5be22f;border-radius:4px;max-width:calc(100% - 34px)}
.arr.go .afill{animation:afill 1s ease forwards .2s}
@keyframes afill{to{width:calc(100% - 34px)}}
.arr .head{position:absolute;right:0;top:-12px;border:25px solid transparent;border-left:36px solid #fff;border-right:0;transition:border-left-color .2s 1.2s}
.arr.go .head{border-left-color:#5be22f}
.arrlabel{position:absolute;left:222px;width:804px;top:20px;text-align:center;color:#fff;font-size:32px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.vcard{position:absolute;left:190px;top:190px;width:900px;height:296px;background:#fff;border-radius:30px;box-shadow:0 10px 0 rgba(90,40,120,.25);display:flex;align-items:center;gap:34px;padding:18px 40px;animation:cardin .45s cubic-bezier(.2,1.3,.4,1)}
@keyframes cardin{from{transform:translateY(40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.vg{display:grid;grid-template-columns:56px 84px 84px;grid-template-rows:28px 30px 64px 64px 8px 66px;font-size:58px;text-align:center;align-items:center;flex:none;font-variant-numeric:tabular-nums}
.vg .hd{font-size:21px;border-radius:9px;color:#fff;margin:0 14px;line-height:28px}
.vg .hd.t{background:var(--tens);color:#fff}.vg .hd.o{background:var(--ones);color:#fff}
.vg .t{color:var(--tens)}.vg .o{color:var(--ones)}
.vg .mk{font-size:28px;color:#e3263a;align-self:end}
.vg .line{grid-column:1/4;height:6px;background:var(--ink);border-radius:3px}
.vg .op{font-size:56px;color:var(--ink)}
.vg .strike{position:relative}
.vg .strike::after{content:'';position:absolute;left:14%;right:14%;top:50%;height:6px;background:#e3263a;border-radius:3px;transform:rotate(-30deg) scaleX(0);animation:strike .3s ease forwards var(--d,0s)}
@keyframes strike{to{transform:rotate(-30deg) scaleX(1)}}
.vg .res{font-size:64px}
.colhl{border-radius:16px;background:rgba(255,200,80,.0)}
.pin{opacity:0;animation:pin .35s cubic-bezier(.2,1.4,.4,1) forwards;animation-delay:var(--d,0s)}
@keyframes pin{from{opacity:0;transform:scale(.3)}to{opacity:1;transform:none}}
.vsteps{display:flex;flex-direction:column;gap:12px;font-size:29px;min-width:0}
.vsteps .st{display:flex;align-items:center;gap:10px;line-height:1.25}
.vsteps .st b{font-weight:400;color:#fff;background:var(--ink);border-radius:10px;padding:2px 10px;font-size:22px;flex:none}
.vsteps .st b.o{background:var(--ones)}.vsteps .st b.t{background:var(--tens)}.vsteps .st b.r{background:#e3263a}
.vsteps .big{font-size:40px;margin-top:4px}
.cntrow{display:flex;align-items:center;gap:14px;font-size:32px}
.miniset{display:flex;gap:4px;align-items:flex-end;flex:none;width:250px;flex-wrap:wrap}
.miniset .mr{width:12px;height:64px;border-radius:5px;background:repeating-linear-gradient(#f3a646 0 5px,#ffe7c2 5px 6.4px);border:2px solid #d9a35f}
.miniset .mc{width:20px;height:20px;border-radius:50%;background:#f3a646;border:2px solid #d0812a}

/* ---------- 아래 판(보기 버튼) ---------- */
.dock{position:absolute;left:0;right:0;top:560px;height:160px;z-index:6;background:linear-gradient(#f9a6c6,var(--dock));display:flex;align-items:center;justify-content:center;gap:26px;border-top:6px solid #ffd3e3}
.ans{width:200px;height:112px;border:none;border-radius:22px;background:linear-gradient(#5fe042,#36bb22);box-shadow:inset 0 6px 0 rgba(255,255,255,.35),0 8px 0 var(--green-d),0 13px 16px rgba(80,0,40,.2);color:#fff;font-size:74px;line-height:1;text-shadow:0 3px 0 rgba(0,0,0,.18);cursor:pointer;animation:ansin .35s cubic-bezier(.2,1.4,.4,1) backwards;font-variant-numeric:tabular-nums}
.ans:active{transform:translateY(6px);box-shadow:inset 0 6px 0 rgba(255,255,255,.35),0 2px 0 var(--green-d)}
.ans.wrong{background:#cdbdc6;box-shadow:0 8px 0 #9f8d99;color:#f5eef2;animation:shake .45s ease;pointer-events:none}
.ans.pulse{animation:pulse .9s ease-in-out infinite}
@keyframes ansin{from{transform:translateY(40px) scale(.7);opacity:0}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(4px)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08);filter:brightness(1.15)}}
.prompt{display:flex;align-items:center;gap:16px;background:#fff;border-radius:44px;padding:16px 36px 16px 18px;font-size:34px;box-shadow:0 7px 0 #df73a0;cursor:pointer;border:none;animation:ansin .35s ease backwards;max-width:1180px}
.prompt .spk{width:52px;height:52px;border-radius:50%;background:var(--bora);display:grid;place-items:center;flex:none}
.prompt .spk svg{width:30px;height:30px}
.kp{display:flex;gap:10px}
.key{width:78px;height:100px;border:none;border-radius:18px;background:linear-gradient(#5fe042,#36bb22);box-shadow:inset 0 5px 0 rgba(255,255,255,.35),0 7px 0 var(--green-d);color:#fff;font-size:54px;cursor:pointer;line-height:1;text-shadow:0 2px 0 rgba(0,0,0,.18)}
.key:active{transform:translateY(5px);box-shadow:0 2px 0 var(--green-d)}
.key.del{width:110px;background:linear-gradient(#ffb0c9,#ff8db1);box-shadow:inset 0 5px 0 rgba(255,255,255,.35),0 7px 0 #d55c86;font-size:30px}
.key.ok{width:150px;background:linear-gradient(#ffd85a,#ffbd1f);box-shadow:inset 0 5px 0 rgba(255,255,255,.45),0 7px 0 var(--sun-d);color:var(--ink);font-size:40px;text-shadow:none}
.nextbtn{position:relative;overflow:hidden;width:420px;height:104px;border:none;border-radius:52px;background:linear-gradient(#ffd85a,#ffbd1f);box-shadow:inset 0 6px 0 rgba(255,255,255,.45),0 8px 0 var(--sun-d);font-size:46px;color:var(--ink);cursor:pointer;animation:ansin .35s ease backwards}
.nextbtn .tm{position:absolute;left:0;bottom:0;height:10px;background:rgba(160,90,0,.35);width:0}
.nextbtn span{position:relative}

/* ---------- 지도 ---------- */
.mapbg{position:absolute;inset:0;background:linear-gradient(#7fd6ff 0,#bff0ff 150px,#2fb6e6 151px,#4fd2f2 250px,#ffe7aa 251px,#ffd47c 100%)}
.wave{position:absolute;left:0;right:0;top:236px;height:28px;background:radial-gradient(circle at 20px 0,#fff 14px,transparent 15px) 0 0/40px 28px;opacity:.9}
.sun{position:absolute;left:1120px;top:72px;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle,#fff7b0,#ffd23c);box-shadow:0 0 0 12px rgba(255,236,120,.35)}
.cloud{position:absolute;height:34px;border-radius:20px;background:#fff;opacity:.95}
.cloud::before,.cloud::after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:40px;height:40px;left:14px;top:-20px}.cloud::after{width:30px;height:30px;left:46px;top:-14px}
.mapdeco{position:absolute;pointer-events:none}
.mappath{position:absolute;inset:0;pointer-events:none}
.node{position:absolute;width:150px;height:170px;border:none;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.node .pad{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:46px;color:#fff;background:radial-gradient(circle at 50% 38%,#b9c3d6,#8794b0);box-shadow:inset 0 -8px 0 rgba(0,0,0,.15),0 8px 0 #6c7894,0 12px 14px rgba(120,80,20,.3);text-shadow:0 3px 0 rgba(0,0,0,.2)}
.node.done .pad{background:radial-gradient(circle at 50% 38%,#7fe0ff,#2e9fe6);box-shadow:inset 0 -8px 0 rgba(0,0,0,.15),0 8px 0 #1c74b8,0 12px 14px rgba(120,80,20,.3)}
.node.rec .pad{background:radial-gradient(circle at 50% 38%,#ffd36a,#ff9a1f);box-shadow:inset 0 -8px 0 rgba(0,0,0,.12),0 8px 0 #d26d00,0 0 0 8px rgba(255,255,255,.75),0 12px 18px rgba(120,80,20,.35);animation:recpulse 1.4s ease-in-out infinite}
@keyframes recpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.node .nl{font-size:19px;background:rgba(255,255,255,.92);color:var(--ink);border-radius:12px;padding:2px 10px;white-space:nowrap;margin-top:8px}
.node .ns{display:flex;gap:2px}
.node .ns svg{width:24px;height:24px}
.maptori{position:absolute;width:120px;height:120px;pointer-events:none;z-index:5;animation:mapbob 1.2s ease-in-out infinite;transition:left .5s,top .5s}
@keyframes mapbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.chest{position:absolute;width:130px;height:150px;border:none;background:none;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center}
.chest svg{width:110px;height:100px}
.chest .nl{font-size:19px;background:rgba(255,255,255,.92);border-radius:12px;padding:2px 10px;margin-top:6px}

/* ---------- 시작 화면 ---------- */
.splashcard{position:absolute;left:50%;top:94px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.logo{font-size:96px;line-height:1.05;color:#fff;-webkit-text-stroke:14px #3a2a8a;paint-order:stroke fill;text-shadow:0 10px 0 rgba(58,42,138,.35);letter-spacing:2px;transform:rotate(-3deg)}
.logo .c1{color:#ffd54a}.logo .c2{color:#ff8fc1}
.subpill{font-size:30px;color:#fff;background:#ff6aa2;border-radius:30px;padding:6px 26px;box-shadow:0 6px 0 #d4417a}
.bigbtn{border:none;cursor:pointer;font-size:50px;color:var(--ink);background:linear-gradient(#ffe066,#ffbf1f);border-radius:60px;padding:20px 70px;box-shadow:inset 0 7px 0 rgba(255,255,255,.5),0 10px 0 var(--sun-d),0 16px 22px rgba(120,60,0,.3);animation:pulse 1.6s ease-in-out infinite}
.bigbtn:active{transform:translateY(6px)}
.splashchars{position:absolute;left:0;right:0;bottom:30px;height:260px;pointer-events:none}
.splashchars .chr-wrap{top:auto;bottom:0;width:240px;height:240px}
.floatck{position:absolute;width:56px;height:56px;animation:floaty 3s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-16px) rotate(8deg)}}
.rotatehint{position:absolute;inset:0;z-index:200;background:rgba(20,10,50,.92);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;font-size:48px;text-align:center}
.rotatehint.on{display:flex}

/* ---------- 결과 화면 ---------- */
.clearbg{position:absolute;inset:0;background:radial-gradient(circle at 25% 40%,rgba(255,255,255,.35),transparent 40%),linear-gradient(160deg,#6c86ff,#8c6cf2 55%,#c79bf5)}
.bubbleo{position:absolute;border-radius:50%;border:3px solid rgba(255,255,255,.55);background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.6),rgba(255,255,255,.05) 60%);animation:floaty 5s ease-in-out infinite}
.hangstar{position:absolute;top:0;width:2px;background:rgba(255,255,255,.6)}
.hangstar svg{position:absolute;bottom:-22px;left:-18px;width:38px;height:38px}
.podium{position:absolute;z-index:2;left:120px;top:520px;width:420px;height:90px;border-radius:50%;background:linear-gradient(#e9f3ff,#a9c8f5);box-shadow:inset 0 -12px 0 #7fa4e0,0 14px 0 #5f7fc4}
.podchar{position:absolute;z-index:1;left:180px;top:250px;width:300px;height:330px}
.podchar .chr-wrap{position:absolute;left:0;top:0;width:300px;height:300px}
.podchar .chr-wrap .bob{animation:dance .8s ease-in-out infinite}
@keyframes dance{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-14px)}}
.cpanel{position:absolute;left:600px;top:40px;width:640px;display:flex;flex-direction:column;align-items:center;gap:14px}
.cleartitle{font-size:118px;line-height:1;color:#ffe14d;-webkit-text-stroke:14px #3b2a7a;paint-order:stroke fill;transform:rotate(-4deg);letter-spacing:4px;animation:cleartitle .6s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes cleartitle{from{transform:rotate(-4deg) scale(.2);opacity:0}}
.cmsg{font-size:34px;color:#fff;text-shadow:0 3px 0 rgba(40,20,90,.4)}
.stars3{display:flex;gap:18px}
.stars3 svg{width:86px;height:86px;filter:drop-shadow(0 5px 0 rgba(40,20,90,.3))}
.stars3 .on{animation:starin .5s cubic-bezier(.2,1.6,.4,1) backwards}
@keyframes starin{from{transform:scale(0) rotate(-90deg)}}
.crow{display:flex;gap:18px;align-items:stretch}
.stats{background:rgba(255,255,255,.92);border-radius:22px;padding:14px 24px;display:grid;grid-template-columns:auto auto;column-gap:24px;row-gap:8px;font-size:28px;align-content:center;font-variant-numeric:tabular-nums}
.stats .k{color:#7a6a90}
.rewards{display:flex;gap:12px}
.rcard{width:128px;background:linear-gradient(#ffe3f1,#ffc4e1);border:4px solid #fff;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 6px;font-size:17px;text-align:center;animation:pin .4s cubic-bezier(.2,1.4,.4,1) backwards}
.rcard svg{width:58px;height:58px}
.rcard b{font-weight:400;font-size:26px;color:#2e6fd8}
.cbtns{display:flex;gap:14px;margin-top:4px}
.cbtn{border:none;cursor:pointer;font-size:30px;border-radius:40px;padding:14px 30px;background:#fff;color:var(--ink);box-shadow:0 7px 0 rgba(60,30,110,.35)}
.cbtn.main{background:linear-gradient(#5fe042,#36bb22);color:#fff;box-shadow:0 7px 0 var(--green-d)}
.cbtn.alt{background:linear-gradient(#ffd85a,#ffbd1f);box-shadow:0 7px 0 var(--sun-d)}
.cbtn:active{transform:translateY(5px)}
.confetti i{position:absolute;top:-30px;width:14px;height:22px;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(800px) rotate(720deg)}}

/* ---------- 별 전환 / 모달 ---------- */
.wipe{position:absolute;inset:0;z-index:150;pointer-events:none;display:none}
.wipe.on{display:block;pointer-events:auto}
.wipe svg{position:absolute;width:520px;height:520px;margin:-260px 0 0 -260px;transform:scale(0) rotate(-30deg);transition:transform .5s cubic-bezier(.3,1.2,.5,1)}
.wipe.cover svg{transform:scale(1) rotate(0)}
.modal{position:absolute;inset:0;z-index:120;background:rgba(30,15,60,.55);display:none;align-items:center;justify-content:center}
.modal.on{display:flex;animation:fadein .2s ease}
.mcard{width:640px;background:#fff;border-radius:34px;padding:30px 40px 34px;display:flex;flex-direction:column;align-items:center;gap:16px;box-shadow:0 14px 0 rgba(60,30,110,.3);animation:cardin .35s cubic-bezier(.2,1.3,.4,1);text-align:center}
.mcard h2{margin:0;font-weight:400;font-size:44px}
.mcard .chip{font-size:22px;color:#fff;background:var(--bora);border-radius:16px;padding:3px 16px}
.mcard p{margin:0;font-size:27px;color:#5d4f70;line-height:1.4}
.mcard .ex{font-size:46px;background:#2f6b4f;color:#fff;border-radius:16px;padding:6px 28px;border:6px solid #c8916c}
.mcard .ex .t{color:#9ccbff}.mcard .ex .o{color:#ffcf7d}
.mbtns{display:flex;gap:16px;margin-top:6px}
.setrow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:28px;padding:8px 0;border-bottom:2px dashed #eadff2;text-align:left}
.seg{display:flex;background:#f0e8f7;border-radius:30px;padding:4px;gap:4px;flex:none}
.seg button{border:none;background:none;font-size:23px;padding:8px 18px;border-radius:24px;cursor:pointer;color:#6a5a80}
.seg button.on{background:var(--bora);color:#fff}
.smallnote{font-size:20px;color:#8d7fa0}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const W=1280,H=720;
const stage=$('#stage');
let S=1;
function fit(){
  S=Math.min(innerWidth/W,innerHeight/H);
  stage.style.transform='translate(-50%,-50%) scale('+S+')';
  const portraitPhone=innerHeight>innerWidth&&innerWidth<700;
  $('#rotateHint').classList.toggle('on',portraitPhone&&!rotateDismissed);
}
let rotateDismissed=false;
addEventListener('resize',fit);
$('#btnRotateOk').onclick=()=>{rotateDismissed=true;fit();};
fit();

const wait=ms=>new Promise(r=>setTimeout(r,ms));
const ri=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pad2=n=>String(n).padStart(2,'0');
const fmtTime=ms=>{const s=Math.floor(ms/1000);return pad2(Math.floor(s/60))+':'+pad2(s%60);};

/* ---------------- 저장 ---------------- */
const KEY='tori-cookie-math-v1';
const DEF={stars:{},gems:0,day:'',today:0,settings:{sfx:true,voice:true,count:6,input:'choice'},total:{solved:0,correct:0}};
function load(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(KEY));}catch(e){}
  const base=JSON.parse(JSON.stringify(DEF));
  if(!d||typeof d!=='object')return base;
  return Object.assign(base,d,{settings:Object.assign(base.settings,d.settings||{}),total:Object.assign(base.total,d.total||{})});
}
const store=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function rollDay(){if(store.day!==todayStr()){store.day=todayStr();store.today=0;save();}}

/* ---------------- 소리 ---------------- */
let ac=null;
function ensureAudio(){
  try{
    if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C();}
    if(ac&&ac.state==='suspended')ac.resume();
  }catch(e){}
}
function tone(f,dur,type,vol,when,slide){
  if(!store.settings.sfx||!ac)return;
  const t=ac.currentTime+(when||0);
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||.2,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+0.05);
}
const SFX={
  tap(n){const f=520*Math.pow(1.06,(n||0)%12);tone(f,.1,'sine',.18);tone(f*1.5,.08,'sine',.08,.03);},
  move(){tone(420,.22,'triangle',.16,0,980);},
  give(){tone(300,.09,'square',.06);tone(240,.12,'square',.06,.09);tone(700,.12,'sine',.1,.18);},
  bundle(){[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.18,i*.08));},
  unpack(){[1047,880,784,659,523].forEach((f,i)=>tone(f,.12,'triangle',.14,i*.06));},
  correct(){tone(880,.14,'sine',.25);tone(1318,.32,'sine',.25,.11);tone(1760,.25,'triangle',.08,.11);},
  wrong(){tone(240,.28,'sawtooth',.09,0,150);},
  click(){tone(660,.05,'square',.05);},
  boop(){tone(330,.12,'sine',.12,0,260);},
  fanfare(){[[523,0],[659,.12],[784,.24],[1047,.36],[784,.52],[1047,.64]].forEach(([f,w],i)=>tone(f,i===5?.6:.16,'triangle',.2,w));},
  star(i){tone(880+i*220,.22,'triangle',.18,0,1760+i*300);}
};

let koVoice=null;
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices();
    koVoice=vs.find(v=>/^ko/i.test(v.lang)&&/Yuna|유나|Sora|Google|Heami/i.test(v.name))||vs.find(v=>/^ko/i.test(v.lang))||null;
  }catch(e){}
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(text){
  if(!store.settings.voice||!('speechSynthesis' in window)||!text)return;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text);
    u.lang='ko-KR';if(koVoice)u.voice=koVoice;u.rate=1.0;u.pitch=1.15;
    speechSynthesis.speak(u);
  }catch(e){}
}

const T=n=>Math.floor(n/10),O=n=>n%10;
function mk(op,a,b){return {op,a,b,ans:op==='add'?a+b:op==='sub'?a-b:a};}
const GEN={
  count(){let n;do{n=ri(11,99);}while(n%10===0&&Math.random()<.6);return mk('count',n,0);},
  add21(){let a,b;do{a=ri(10,89);b=ri(1,9);}while(O(a)+b>9);return mk('add',a,b);},
  add22(){let a,b;do{a=ri(10,88);b=ri(10,88);}while(T(a)+T(b)>9||O(a)+O(b)>9||(O(a)===0&&O(b)===0&&Math.random()<.8));return mk('add',a,b);},
  sub21(){let a,b;do{a=ri(11,99);b=ri(1,9);}while(b>O(a));return mk('sub',a,b);},
  sub22(){let a,b;do{a=ri(21,99);b=ri(10,a-1);}while(O(b)>O(a)||T(b)>T(a)||(O(b)===0&&Math.random()<.7));return mk('sub',a,b);},
  addC(){let a,b;if(Math.random()<.45){do{a=ri(11,89);b=ri(2,9);}while(O(a)+b<10||a+b>99);}else{do{a=ri(11,78);b=ri(11,78);}while(O(a)+O(b)<10||a+b>99);}return mk('add',a,b);},
  subB(){let a,b;if(Math.random()<.45){do{a=ri(20,99);b=ri(2,9);}while(b<=O(a));}else{do{a=ri(21,98);b=ri(11,a-2);}while(O(b)<=O(a)||T(b)>=T(a));}return mk('sub',a,b);},
  mix(){return GEN[pick(['add22','sub22','addC','subB','addC','subB'])]();}
};
function makeRound(st,n){
  const out=[],seen=new Set();let guard=0;
  while(out.length<n&&guard++<500){const p=GEN[st.gen]();const k=p.op+p.a+'_'+p.b;if(seen.has(k))continue;seen.add(k);out.push(p);}
  return out;
}
function choicesFor(p){
  const ans=p.ans,c=[];
  if(p.op==='add'&&O(p.a)+O(p.b)>=10)c.push(ans-10);
  if(p.op==='sub'&&O(p.b)>O(p.a))c.push((T(p.a)-T(p.b))*10+(O(p.b)-O(p.a)));
  if(p.op==='count'&&O(ans)>0&&O(ans)!==T(ans))c.push(O(ans)*10+T(ans));
  const pool=shuffle([ans+10,ans-10,ans+1,ans-1,ans+2,ans-2,ans+11,ans-9]);
  const out=[];
  for(const x of c.concat(pool)){if(x>=0&&x<=99&&x!==ans&&!out.includes(x))out.push(x);if(out.length===3)break;}
  return shuffle([ans].concat(out));
}
function eqHTML(p,showAns){
  const num=n=>n>=10?`<span class="t">${T(n)}</span><span class="o">${O(n)}</span>`:`<span class="o">${n}</span>`;
  const sym=p.op==='add'?'+':'−';
  return `${num(p.a)}<span class="op">${sym}</span>${num(p.b)}<span class="op">=</span>${showAns?`<span class="solved">${p.ans}</span>`:'<span class="q">?</span>'}`;
}

/* ---------------- 놀이 ---------------- */
const scene=$('#scene'),dock=$('#dock'),fx=$('#fx'),hand=$('#hand'),explain=$('#explain');
const bubL=$('#bubL'),bubR=$('#bubR'),labL=$('#labL'),labR=$('#labR'),eqBoard=$('#eqBoard');
$('#chTori').innerHTML=toriSVG();$('#chBora').innerHTML=boraSVG();
const PL=makePlate($('#plateL')),PR=makePlate($('#plateR'));
let R=null,busy=false,handTimer=null,timerInt=null,nextTimer=null;

function setMood(which,mood,ms){
  const w=which==='tori'?$('#chTori'):$('#chBora');const svg=w.querySelector('.chr');
  svg.dataset.mood=mood;
  if(mood==='happy'){w.classList.remove('hop');void w.offsetWidth;w.classList.add('hop');clearTimeout(w._h);w._h=setTimeout(()=>w.classList.remove('hop'),520);}
  clearTimeout(w._t);if(ms)w._t=setTimeout(()=>{svg.dataset.mood='normal';},ms);
}
function setBub(el,html,cls){el.innerHTML=html;el.classList.toggle('small',!!(cls&&cls.small));el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
const numHTML=n=>`<span class="num">${n}</span>`;
const QBOX='<span class="qbox">?</span>';
function toStage(r){const s=stage.getBoundingClientRect();return {x:(r.left-s.left)/S,y:(r.top-s.top)/S,w:r.width/S,h:r.height/S};}
function sceneXY(el){const r=toStage(el.getBoundingClientRect());return {x:r.x,y:r.y-60,w:r.w,h:r.h};}

// FLIP: 모든 쿠키의 위치를 기억했다가 DOM을 바꾼 뒤 부드럽게 이동
function flip(mutate,mover){
  const els=[...scene.querySelectorAll('.item')],before=new Map();
  els.forEach(e=>before.set(e,e.getBoundingClientRect()));
  mutate();
  scene.querySelectorAll('.item').forEach(e=>{
    const b=before.get(e);if(!b)return;
    const a=e.getBoundingClientRect(),dx=(b.left-a.left)/S,dy=(b.top-a.top)/S;
    if(Math.abs(dx)<1&&Math.abs(dy)<1)return;
    if(e===mover){
      e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:`translate(${dx/2}px,${dy/2-80}px) scale(1.3)`,offset:.5},{transform:'none'}],{duration:540,easing:'ease-in-out'});
    }else{
      e.animate([{transform:`translate(${dx}px,${dy}px)`},{transform:'none'}],{duration:380,easing:'cubic-bezier(.25,.9,.35,1.1)'});
    }
  });
}
function wiggle(el){el.animate([{transform:'rotate(0)'},{transform:'rotate(-10deg)'},{transform:'rotate(10deg)'},{transform:'rotate(-6deg)'},{transform:'rotate(0)'}],{duration:420});}
function sparks(x,y,n,colors){
  colors=colors||['#ffd23c','#ff7aa5','#7fd6ff','#9ef07a','#c59bff'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span');s.className='spark';s.textContent='★';
    const ang=Math.random()*Math.PI*2,dist=70+Math.random()*120;
    s.style.left=x+'px';s.style.top=y+'px';s.style.color=pick(colors);
    s.style.setProperty('--dx',Math.cos(ang)*dist+'px');s.style.setProperty('--dy',Math.sin(ang)*dist+'px');
    s.style.fontSize=(18+Math.random()*20)+'px';
    fx.appendChild(s);setTimeout(()=>s.remove(),950);
  }
}
function floatText(x,y,txt){const d=document.createElement('div');d.className='floattxt';d.textContent=txt;d.style.left=x+'px';d.style.top=y+'px';fx.appendChild(d);setTimeout(()=>d.remove(),1050);}

function startRound(st,list){
  ensureAudio();
  const n=store.settings.count;
  R={stage:st,review:!!list,probs:list?list.map(p=>Object.assign({},p)):makeRound(st,n),i:0,results:[],t0:performance.now(),bundleTold:false,unpackTold:false};
  $('#playTitle').textContent=(list?'다시 풀기 · ':'')+`${st.id}단계 · ${st.title}`;
  clearInterval(timerInt);
  timerInt=setInterval(()=>{if(R)$('#timerTxt').textContent=fmtTime(performance.now()-R.t0);},500);
  $('#timerTxt').textContent='00:00';
  starWipe(()=>{show('scrPlay');startProblem();});
}
function updateProgress(){
  const N=R.probs.length;$('#progTxt').textContent=`${Math.min(R.i+1,N)}/${N}`;
  $('#progFill').style.width=`calc(${(R.i/N)*100}% - 6px)`;
}
function inputMode(){return R.stage.challenge?'keypad':store.settings.input;}

function startProblem(){
  const p=R.p=R.probs[R.i];
  R.phase='intro';R.attempts=0;R.typed='';R.counted=0;R.fed=false;R.remaining=p.op==='sub'?p.b:0;
  busy=false;hideHand();clearTimeout(nextTimer);
  explain.classList.remove('on');explain.innerHTML='';fx.innerHTML='';
  scene.classList.toggle('mode-count',p.op==='count');
  R.type=pick(CK_TYPES);
  updateProgress();
  ['tori','bora'].forEach(w=>setMood(w,'normal'));
  [PL,PR].forEach(P=>{P.rods.innerHTML='';P.sgrid.innerHTML='';layoutSingles(P);});
  // 접시 채우기
  const fill=(P,n)=>{for(let i=0;i<T(n);i++)P.rods.appendChild(makeRod(R.type));for(let i=0;i<O(n);i++)P.sgrid.appendChild(makeCookie(R.type));layoutSingles(P);};
  if(p.op==='count'){
    fill(PL,p.a);
    setBub(bubL,QBOX);labL.textContent='모두 몇 개?';
    setBub(bubR,numHTML(0));labR.textContent='센 수';
    eqBoard.innerHTML=countBoard();
  }else if(p.op==='add'){
    fill(PL,p.a);fill(PR,p.b);
    setBub(bubL,numHTML(p.a));labL.textContent='토리 쿠키';
    setBub(bubR,numHTML(p.b));labR.textContent='보라 쿠키';
    eqBoard.innerHTML=eqHTML(p,false);
  }else{
    fill(PL,p.a);
    setBub(bubL,numHTML(p.a));labL.textContent='토리 쿠키';
    setBub(bubR,numHTML(p.b));labR.textContent='보라가 먹을 쿠키';
    eqBoard.innerHTML=eqHTML(p,false);
  }
  // 등장 애니메이션
  [...scene.querySelectorAll('.item')].forEach((e,i)=>e.animate([{transform:'scale(0)',opacity:0},{transform:'scale(1.2)',opacity:1,offset:.7},{transform:'scale(1)'}],{duration:380,delay:i*40,easing:'ease-out',fill:'backwards'}));
  if(R.stage.challenge){
    R.phase='answer';showAnswerUI();
    R.voice=questionVoice(p);say(R.voice);
    return;
  }
  R.phase='act';
  let txt,voice;
  if(p.op==='count'){txt='묶음부터 하나씩 눌러서 세어 보아요';voice='쿠키를 눌러서 세어 보아요. 10개씩 묶음부터 세어요!';}
  else if(p.op==='add'){txt='보라 쿠키를 눌러서 토리 접시로 옮겨요';voice=`토리는 ${native(p.a,1)} 개, 보라는 ${native(p.b,1)} 개 있어요. 보라 쿠키를 눌러서 토리 접시로 옮겨 주세요!`;}
  else{txt=`보라에게 쿠키 ${p.b}개를 주세요`;voice=`토리는 쿠키가 ${native(p.a,1)} 개 있어요. 보라가 ${native(p.b,1)} 개 먹고 싶대요. 쿠키를 눌러서 보라에게 주세요!`;}
  R.voice=voice;
  showPrompt(txt);say(voice);
  armHand(R.i===0?1600:3200);
}
function countBoard(){
  const t=PL.rods.querySelectorAll('.counted').length,o=PL.sgrid.querySelectorAll('.counted').length;
  return `<span class="lbl">묶음</span><span class="t">${R.counted?t:'?'}</span><span class="lbl" style="margin-left:14px">낱개</span><span class="o">${R.counted?o:'?'}</span>`;
}
function questionVoice(p){
  if(p.op==='count')return '쿠키는 모두 몇 개일까요?';
  if(p.op==='add')return `${p.a} 더하기 ${p.b}${jo(p.b,'은','는')} 얼마일까요?`;
  return `${p.a} 빼기 ${p.b}${jo(p.b,'은','는')} 얼마일까요?`;
}
function showPrompt(txt){
  dock.innerHTML=`<button type="button" class="prompt" id="promptBtn"><span class="spk"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16 8.5a5 5 0 0 1 0 7" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></span><span>${txt}</span></button>`;
  $('#promptBtn').onclick=()=>say(R.voice);
}
$('#btnSpeak').onclick=()=>{ensureAudio();if(R)say(R.voice);};

/* 손가락 힌트 */
function hideHand(){hand.classList.remove('on');clearTimeout(handTimer);}
function armHand(ms){clearTimeout(handTimer);handTimer=setTimeout(showHand,ms);}
function handTarget(){
  const p=R.p;
  if(p.op==='count')return PL.rods.querySelector('.item:not(.counted)')||PL.sgrid.querySelector('.item:not(.counted)');
  if(p.op==='add')return PR.rods.lastElementChild||PR.sgrid.lastElementChild;
  if(R.remaining<=0)return null;
  if(R.remaining>=10)return PL.rods.lastElementChild;
  return PL.sgrid.lastElementChild||PL.rods.lastElementChild;
}
function showHand(){
  if(!R||R.phase!=='act'||busy)return;
  const t=handTarget();if(!t)return;
  const r=sceneXY(t);
  hand.style.left=(r.x+r.w/2-22)+'px';hand.style.top=(r.y+Math.min(r.h/2,60)-4)+'px';
  hand.classList.add('on');
  armHand(7000);
}

/* 쿠키 누르기 */
scene.addEventListener('pointerdown',e=>{
  const it=e.target.closest('.item');if(!it||!R||busy)return;
  const p=R.p;
  const canAct=R.phase==='act'||(R.phase==='answer'&&R.stage.challenge&&p.op!=='count');
  if(!canAct){wiggle(it);return;}
  ensureAudio();hideHand();if(R.phase==='act')armHand(7000);
  const side=it.closest('.plate')===PL.el?'L':'R';
  if(p.op==='count')onCountTap(it);
  else if(p.op==='add')onAddTap(it,side);
  else onSubTap(it,side);
});
function onCountTap(it){
  if(it.classList.contains('counted')){wiggle(it);return;}
  const isRod=it.classList.contains('rod');
  if(!isRod&&PL.rods.querySelector('.item:not(.counted)')){
    PL.rods.querySelectorAll('.item:not(.counted)').forEach(wiggle);SFX.boop();say('10개씩 묶음부터 세어 볼까요?');return;
  }
  R.counted+=isRod?10:1;
  it.classList.add('counted');
  const b=document.createElement('span');b.className='badge';b.textContent=R.counted;it.appendChild(b);
  it.animate([{transform:'scale(1)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:260});
  SFX.tap(Math.floor(R.counted/10)+R.counted%10);
  say(native(R.counted));
  setBub(bubR,numHTML(R.counted));eqBoard.innerHTML=countBoard();
  setMood('bora','happy',600);
  if(!scene.querySelector('#plateL .item:not(.counted)'))setTimeout(toAnswer,900);
}
function moveItem(it,to){
  const from=it.closest('.plate')===PL.el?PL:PR;
  flip(()=>{
    if(it.classList.contains('rod'))to.rods.appendChild(it);else to.sgrid.appendChild(it);
    layoutSingles(from);layoutSingles(to);
  },it);
}
async function onAddTap(it,side){
  if(side==='L'){wiggle(it);SFX.boop();say('보라 접시의 쿠키를 눌러 보세요!');return;}
  const isRod=it.classList.contains('rod');
  moveItem(it,PL);SFX.move();setMood('tori','happy',700);
  if(R.phase==='act'&&bubL.textContent!=='?')setBub(bubL,QBOX);
  if(!isRod&&nSingles(PL)===10){busy=true;await wait(560);await bundle(PL,false);busy=false;}
  if(R.phase==='act'&&nRods(PR)+nSingles(PR)===0)setTimeout(toAnswer,500);
}
async function onSubTap(it,side){
  if(side==='R'){wiggle(it);return;}
  if(R.remaining<=0){wiggle(it);SFX.boop();if(R.phase==='act')say('보라는 이제 배불러요!');return;}
  const isRod=it.classList.contains('rod');
  if(isRod){
    if(R.remaining>=10){moveItem(it,PR);R.remaining-=10;afterGive();}
    else if(nSingles(PL)>=R.remaining){SFX.boop();wiggle(it);PL.sgrid.querySelectorAll('.item').forEach(wiggle);say('낱개 쿠키로 줄 수 있어요!');return;}
    else{busy=true;await unpack(PL,it);busy=false;if(R.phase==='act')armHand(4000);return;}
  }else{
    moveItem(it,PR);R.remaining-=1;afterGive();
  }
  if(nSingles(PR)===10){busy=true;await wait(560);await bundle(PR,true);busy=false;}
  if(R.remaining===0&&!R.fed){
    R.fed=true;
    setBub(bubR,'<span class="num" style="font-size:38px">고마워!</span>');
    if(R.phase==='act'){say('냠냠! 맛있다!');setTimeout(toAnswer,700);}
  }
}
function afterGive(){
  SFX.give();setMood('bora','happy',700);
  if(R.remaining>0)setBub(bubR,numHTML(R.remaining));
  if(R.phase==='act'&&bubL.textContent!=='?')setBub(bubL,QBOX);
}
// 낱개 10개 → 묶음 1개
async function bundle(P,quiet){
  const singles=[...P.sgrid.children].slice(0,10);
  singles.forEach(s=>s.classList.add('glow'));
  SFX.bundle();
  if(!quiet){say(R.bundleTold?'낱개 10개는 한 묶음!':'낱개 10개가 모여서 10개씩 한 묶음이 되었어요!');R.bundleTold=true;}
  await wait(650);
  const rod=makeRod(R.type);rod.style.opacity='0';
  flip(()=>P.rods.appendChild(rod));
  await wait(400);
  const rr=sceneXY(rod);
  await Promise.all(singles.map((s,i)=>{
    const sr=sceneXY(s);
    const tx=rr.x+rr.w/2-(sr.x+sr.w/2),ty=rr.y+12+i*19-(sr.y+sr.h/2);
    return s.animate([{transform:'none'},{transform:`translate(${tx}px,${ty}px) scale(.55)`}],{duration:420,delay:i*35,easing:'ease-in',fill:'forwards'}).finished.catch(()=>{});
  }));
  singles.forEach(s=>s.remove());
  rod.style.opacity='';
  rod.animate([{transform:'scale(.6)'},{transform:'scale(1.25)'},{transform:'scale(1)'}],{duration:380,easing:'ease-out'});
  flip(()=>layoutSingles(P));
  sparks(rr.x+rr.w/2,rr.y+rr.h/2,12);floatText(rr.x+rr.w/2,rr.y-10,'10개 묶음!');
  await wait(400);
}
// 묶음 1개 → 낱개 10개 (받아내림)
async function unpack(P,rod){
  SFX.unpack();
  say(R.unpackTold?'한 묶음을 풀어요!':'낱개가 모자라요. 한 묶음을 풀어서 낱개 10개로 바꿔요!');R.unpackTold=true;
  await rod.animate([{transform:'rotate(0)'},{transform:'rotate(-8deg) scale(1.1)'},{transform:'rotate(8deg) scale(1.1)'},{transform:'rotate(0) scale(1.15)'}],{duration:450}).finished.catch(()=>{});
  const rr=sceneXY(rod);
  const news=[];
  flip(()=>{rod.remove();for(let i=0;i<10;i++){const c=makeCookie(R.type);P.sgrid.appendChild(c);news.push(c);}layoutSingles(P);});
  news.forEach((c,i)=>{
    const cr=sceneXY(c);
    const dx=rr.x+rr.w/2-(cr.x+cr.w/2),dy=rr.y+12+i*19-(cr.y+cr.h/2);
    c.animate([{transform:`translate(${dx}px,${dy}px) scale(.5)`},{transform:'none'}],{duration:520,delay:i*40,easing:'cubic-bezier(.2,1.3,.4,1)',fill:'backwards'});
  });
  sparks(rr.x+rr.w/2,rr.y+rr.h/2,10);floatText(rr.x+rr.w/2,rr.y-10,'낱개 10개!');
  await wait(950);
}

/* 답하기 */
function toAnswer(){
  if(!R||R.phase!=='act')return;
  R.phase='answer';hideHand();
  setBub(bubL,QBOX);
  if(R.p.op==='count')labL.textContent='모두 몇 개?';else labL.textContent=R.p.op==='add'?'모두 몇 개?':'남은 쿠키';
  showAnswerUI();
  R.voice=R.p.op==='sub'?`남은 쿠키는 몇 개일까요? ${questionVoice(R.p)}`:questionVoice(R.p);
  say(R.voice);
}
function showAnswerUI(){
  if(R.stage.challenge){setBub(bubL,QBOX);labL.textContent=R.p.op==='count'?'모두 몇 개?':'답';}
  if(inputMode()==='keypad'){
    dock.innerHTML=`<div class="kp">${[1,2,3,4,5,6,7,8,9,0].map(n=>`<button type="button" class="key" data-k="${n}">${n}</button>`).join('')}<button type="button" class="key del" data-k="del">지우기</button><button type="button" class="key ok" data-k="ok">확인</button></div>`;
    dock.querySelectorAll('.key').forEach(b=>b.onclick=()=>onKey(b.dataset.k));
    renderTyped();
  }else{
    const ch=choicesFor(R.p);
    dock.innerHTML=ch.map((v,i)=>`<button type="button" class="ans" data-v="${v}" style="animation-delay:${i*60}ms">${v}</button>`).join('');
    dock.querySelectorAll('.ans').forEach(b=>b.onclick=()=>checkAnswer(+b.dataset.v,b));
  }
}
function renderTyped(){
  const ghost=R.attempts>=2&&!R.typed?`<span class="ghost">${R.p.ans}</span>`:'';
  bubL.innerHTML=`<span class="qbox ${R.typed||ghost?'typed':''}">${R.typed||ghost||'?'}</span>`;
}
function onKey(k){
  if(!R||R.phase!=='answer'||busy)return;
  SFX.click();
  if(k==='del'){R.typed=R.typed.slice(0,-1);}
  else if(k==='ok'){if(R.typed!=='')checkAnswer(+R.typed,null);return;}
  else{if(R.typed.length>=2)R.typed='';if(R.typed==='0')R.typed='';R.typed+=k;}
  renderTyped();
}
function checkAnswer(v,btn){
  if(!R||R.phase!=='answer'||busy)return;
  ensureAudio();
  if(v===R.p.ans){onCorrect(btn);return;}
  R.attempts++;
  SFX.wrong();setMood('tori','sad',1100);setMood('bora','sad',1100);
  const x=document.createElement('div');x.className='xmark';fx.appendChild(x);setTimeout(()=>x.remove(),950);
  if(btn){btn.classList.add('wrong');}
  else{R.typed='';renderTyped();bubL.animate([{transform:'translateX(0)'},{transform:'translateX(-10px)'},{transform:'translateX(10px)'},{transform:'translateX(0)'}],{duration:300});}
  if(R.attempts>=2){
    if(btn){const c=dock.querySelector(`.ans[data-v="${R.p.ans}"]`);c&&c.classList.add('pulse');}
    else renderTyped();
    say(hintVoice(R.p));
  }else say('다시 한 번 생각해 볼까요?');
}
function hintVoice(p){
  if(p.op==='count')return '묶음은 10, 20, 30 이렇게 세고, 낱개는 하나씩 세어요.';
  if(p.op==='add')return '낱개는 낱개끼리, 묶음은 묶음끼리 더해 보세요.';
  return '남은 묶음과 낱개를 세어 보세요.';
}
async function onCorrect(btn){
  R.phase='explain';busy=true;
  const p=R.p,first=R.attempts===0;
  R.results.push({p,ok:first});
  store.total.solved++;if(first)store.total.correct++;store.today++;save();
  SFX.correct();
  dock.querySelectorAll('.ans').forEach(b=>{if(b!==btn)b.style.opacity='.45';});
  const ring=document.createElement('div');ring.className='okring';fx.appendChild(ring);
  sparks(640,250,26);
  setMood('tori','happy',2600);setMood('bora','happy',2600);
  setBub(bubL,numHTML(p.ans));
  bubL.style.color='var(--bora)';setTimeout(()=>bubL.style.color='',2400);
  if(p.op!=='count')eqBoard.innerHTML=eqHTML(p,true);
  const praise=pick(['정답이에요!','맞았어요!','잘했어요!','최고예요!','훌륭해요!']);
  say(praise+' '+answerVoice(p));
  await wait(1150);ring.remove();
  showExplain();
  busy=false;
}
function answerVoice(p){
  if(p.op==='count')return `10개씩 묶음 ${T(p.a)}개와 낱개 ${O(p.a)}개는 ${p.a}!`;
  return `${p.a} ${p.op==='add'?'더하기':'빼기'} ${p.b}${jo(p.b,'은','는')} ${p.ans}!`;
}

/* 풀이 설명 */
function showExplain(){
  const p=R.p;let h='';
  if(p.op!=='count'){
    h+=`<div class="xb l">${p.a}</div><div class="xb r">${p.ans}</div>
      <div class="arrlabel">${p.b}만큼 ${p.op==='add'?'큰':'작은'} 수</div>
      <div class="arr" id="arr"><div class="track"></div><div class="afill"></div><div class="head"></div></div>`;
    h+=`<div class="vcard">${verticalHTML(p)}<div class="vsteps">${stepsHTML(p)}</div></div>`;
  }else{
    const t=T(p.a),o=O(p.a);
    h+=`<div class="vcard" style="flex-direction:column;align-items:flex-start;justify-content:center;gap:14px">
      <div class="cntrow pin" style="--d:.15s"><div class="miniset">${'<i class="mr"></i>'.repeat(t)}</div><span>10개씩 묶음 <b style="color:var(--tens);font-weight:400">${t}</b>개 → <b style="color:var(--tens);font-weight:400">${t*10}</b></span></div>
      <div class="cntrow pin" style="--d:.7s"><div class="miniset">${'<i class="mc"></i>'.repeat(o)}</div><span>낱개 <b style="color:var(--ones);font-weight:400">${o}</b>개 → <b style="color:var(--ones);font-weight:400">${o}</b></span></div>
      <div class="cntrow pin" style="--d:1.3s;font-size:44px">${t*10}과 ${o} → <span><span style="color:var(--tens)">${t}</span><span style="color:var(--ones)">${o}</span></span></div></div>`;
  }
  explain.innerHTML=h;explain.classList.add('on');labL.textContent='';labR.textContent='';
  const arr=$('#arr');if(arr)requestAnimationFrame(()=>arr.classList.add('go'));
  const last=R.i>=R.probs.length-1;
  dock.innerHTML=`<button type="button" class="nextbtn" id="nextBtn"><div class="tm" id="nextTm"></div><span>${last?'결과 보기 ▶':'다음 문제 ▶'}</span></button>`;
  const tm=$('#nextTm');const DUR=7000;
  tm.animate([{width:'0%'},{width:'100%'}],{duration:DUR,easing:'linear',fill:'forwards'});
  const go=()=>{clearTimeout(nextTimer);SFX.click();nextProblem();};
  $('#nextBtn').onclick=go;
  nextTimer=setTimeout(go,DUR);
}
function verticalHTML(p){
  const a1=T(p.a),a0=O(p.a),b1=T(p.b),b0=O(p.b),c1=T(p.ans),c0=O(p.ans);
  const carry=p.op==='add'&&a0+b0>=10,borrow=p.op==='sub'&&b0>a0;
  const sym=p.op==='add'?'+':'−';
  const cell=(txt,cls,d)=>`<div class="${cls||''}${d!=null?' pin':''}" ${d!=null?`style="--d:${d}s"`:''}>${txt}</div>`;
  let h='<div class="vg">';
  h+=cell('')+'<div class="hd t">십</div><div class="hd o">일</div>';
  h+=cell('')+(carry?cell('1','mk',1.3):borrow?cell(a1-1,'mk',.7):cell(''))+(borrow?cell('10','mk',.7):cell(''));
  h+=cell('')+`<div class="t ${borrow?'strike':''}" style="--d:.6s">${a1||''}</div>`+cell(a0,'o');
  h+=cell(sym,'op')+cell(b1||'','t')+cell(b0,'o');
  h+='<div class="line"></div>';
  h+=cell('')+cell(c1||'','t res',2.0)+cell(c0,'o res',1.2);
  return h+'</div>';
}
function stepsHTML(p){
  const a1=T(p.a),a0=O(p.a),b1=T(p.b),b0=O(p.b);
  const st=(d,tag,cls,txt)=>`<div class="st pin" style="--d:${d}s"><b class="${cls}">${tag}</b><span>${txt}</span></div>`;
  let h='';
  if(p.op==='add'){
    if(a0+b0>=10){
      h+=st(.5,'일','o',`${a0} + ${b0} = ${a0+b0}`);
      h+=st(1.2,'올림','r',`10은 십의 자리로 1 받아올림!`);
      h+=st(1.9,'십','t',`1 + ${a1}${b1?' + '+b1:''} = ${1+a1+b1}`);
    }else{
      h+=st(.5,'일','o',`${a0} + ${b0} = ${a0+b0}`);
      h+=st(1.6,'십','t',b1?`${a1} + ${b1} = ${a1+b1}`:`${a1} 그대로 내려요`);
    }
  }else{
    if(b0>a0){
      h+=st(.5,'빌림','r',`${a0}에서 ${b0}${jo(b0,'을','를')} 뺄 수 없어서 10을 빌려와요`);
      h+=st(1.2,'일','o',`${10+a0} − ${b0} = ${10+a0-b0}`);
      h+=st(1.9,'십','t',b1?`${a1-1} − ${b1} = ${a1-1-b1}`:`${a1-1} 그대로 내려요`);
    }else{
      h+=st(.5,'일','o',`${a0} − ${b0} = ${a0-b0}`);
      h+=st(1.6,'십','t',b1?`${a1} − ${b1} = ${a1-b1}`:`${a1} 그대로 내려요`);
    }
  }
  h+=`<div class="st big pin" style="--d:2.4s">${p.a} ${p.op==='add'?'+':'−'} ${p.b} = <span style="color:var(--bora)">${p.ans}</span></div>`;
  return h;
}
function nextProblem(){
  if(!R)return;
  clearTimeout(nextTimer);
  R.i++;
  if(R.i>=R.probs.length){finishRound();return;}
  startProblem();
}

/* 그만하기 */
$('#btnBack').onclick=()=>{
  SFX.click();
  openModal(`<h2>그만할까요?</h2><p>지금까지 푼 문제는 기록되지 않아요.</p>
    <div class="mbtns"><button type="button" class="cbtn" data-a="quit">그만하기</button><button type="button" class="cbtn main" data-a="stay">계속하기</button></div>`,
    {stay:closeModal,quit:()=>{closeModal();quitRound();}});
};
function quitRound(){
  clearInterval(timerInt);clearTimeout(nextTimer);hideHand();R=null;
  try{speechSynthesis.cancel();}catch(e){}
  starWipe(()=>{renderMap();show('scrMap');});
}

/* ---------------- 결과 ---------------- */
function finishRound(){
  clearInterval(timerInt);
  const ms=performance.now()-R.t0,N=R.results.length,ok=R.results.filter(r=>r.ok).length;
  const acc=N?ok/N:0,stars=acc===1?3:acc>=.75?2:1;
  const wrong=R.results.filter(r=>!r.ok).map(r=>r.p);
  const st=R.stage;
  const rewards=[['오늘의 학습',R.review?3:5]];
  if(acc===1&&!R.review)rewards.push(['정확도 100%',5]);
  const gain=rewards.reduce((s,r)=>s+r[1],0);
  store.gems+=gain;
  const prev=store.stars[st.id]||0;
  if(!R.review&&stars>prev)store.stars[st.id]=stars;
  save();
  const review=R.review;
  starWipe(()=>{
    show('scrClear');
    $('#podChar').innerHTML=`<div class="chr-wrap">${toriSVG()}</div>`;
    $('#podChar .chr').dataset.mood='happy';
    $('#clearMsg').textContent=acc===1?'모두 한 번에 맞혔어요! 완벽해요!':acc>=.75?'정말 잘했어요!':'끝까지 잘 해냈어요!';
    $('#clearStars').innerHTML=[1,2,3].map(i=>{const on=!review&&i<=stars;return starSVG(on).replace('<svg',`<svg class="${on?'on':''}" style="animation-delay:${.5+i*.3}s"`);}).join('');
    $('#clearStats').innerHTML=`<span class="k">걸린 시간</span><span>${fmtTime(ms)}</span><span class="k">문제 수</span><span>${N}문제</span><span class="k">한 번에 정답</span><span>${Math.round(acc*100)}%</span>`;
    $('#clearRewards').innerHTML=rewards.map(([t,n],i)=>`<div class="rcard" style="animation-delay:${1.4+i*.25}s"><svg viewBox="0 0 40 40"><use href="#i-gem"/></svg><b>×${n}</b>${t}</div>`).join('');
    let bh=`<button type="button" class="cbtn" id="cbAgain">다시 하기</button>`;
    if(wrong.length)bh+=`<button type="button" class="cbtn alt" id="cbWrong">틀린 문제 다시</button>`;
    bh+=`<button type="button" class="cbtn main" id="cbOk">확인</button>`;
    $('#clearBtns').innerHTML=bh;
    $('#cbAgain').onclick=()=>{SFX.click();startRound(st);};
    if(wrong.length)$('#cbWrong').onclick=()=>{SFX.click();startRound(st,wrong);};
    $('#cbOk').onclick=()=>{SFX.click();starWipe(()=>{renderMap();show('scrMap');});};
    buildClearDeco();
    SFX.fanfare();confetti();
    if(!review)[1,2,3].forEach(i=>{if(i<=stars)setTimeout(()=>SFX.star(i),500+i*300);});
    say(acc===1?'클리어! 모두 한 번에 맞혔어요. 정말 대단해요!':'클리어! 정말 잘했어요!');
  });
  R=null;
}
function buildClearDeco(){
  let h='';
  [[60,120,70],[520,80,40],[1180,560,90],[560,600,50],[1230,140,46],[40,560,56]].forEach(([x,y,s],i)=>h+=`<div class="bubbleo" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;animation-delay:${i*.5}s"></div>`);
  [[110,90],[260,150],[420,70],[1240,60]].forEach(([x,h2])=>h+=`<div class="hangstar" style="left:${x}px;height:${h2}px"><svg viewBox="0 0 40 40"><use href="#i-star" fill="#fff6b0" stroke="#fff" stroke-width="1"/></svg></div>`);
  $('#clearDeco').innerHTML=h;
}
function confetti(){
  const box=document.querySelector('.screen.on .confetti')||$('#confetti');
  const cols=['#ffd23c','#ff7aa5','#7fd6ff','#9ef07a','#c59bff','#ff9f43'];
  box.innerHTML='';
  for(let i=0;i<70;i++){
    const c=document.createElement('i');
    c.style.left=Math.random()*1280+'px';c.style.background=pick(cols);
    c.style.animationDuration=(2+Math.random()*2)+'s';c.style.animationDelay=(Math.random()*.8)+'s';
    c.style.transform=`rotate(${Math.random()*360}deg)`;
    box.appendChild(c);
  }
  setTimeout(()=>{box.innerHTML='';},5000);
}
// 지도 화면에서도 색종이를 쓸 수 있게
(function(){const c=document.createElement('div');c.className='confetti';c.style.cssText='position:absolute;inset:0;pointer-events:none;z-index:50';$('#scrMap').appendChild(c);})();

})();
</script>
